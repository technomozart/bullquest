<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BullQuest · Analytics</title>
<style>
  :root{
    --violet:#6B31E6; --violet2:#7C5CE6; --bg:#F4F2FB; --card:#fff;
    --ink:#20143A; --body:#5B5570; --faint:#9AA0AE; --hair:#ECEAF3;
    --green:#2FA657; --amber:#E0930F; --blue:#4DA6F5;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased;padding:calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
  .wrap{max-width:820px;margin:0 auto}
  /* Side nav. The page grew to a dozen panels and scrolling past the notification composer to
     reach the duplicate queue every time was the whole complaint. */
  .shell{display:flex;gap:22px;align-items:flex-start;max-width:1080px;margin:0 auto}
  .shell .wrap{flex:1;min-width:0;margin:0}
  .sidenav{position:sticky;top:14px;flex:0 0 186px;width:186px;background:var(--card);
           border:1px solid var(--hair);border-radius:14px;padding:8px;max-height:calc(100vh - 28px);overflow:auto}
  .sidenav a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;text-decoration:none;
             color:var(--ink);font-size:13.5px;font-weight:700;line-height:1.25;min-height:38px}
  .sidenav a:hover{background:rgba(93,63,211,.07)}
  .sidenav a.on{background:rgba(93,63,211,.11);color:#5D3FD3}
  .sidenav .n{margin-left:auto;font-size:11.5px;font-weight:800;background:rgba(20,16,40,.07);
              border-radius:999px;padding:2px 7px;color:#6B6785}
  .sidenav a.on .n{background:rgba(93,63,211,.16);color:#5D3FD3}
  .sidenav .grp{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
                color:#8B87A3;padding:11px 10px 5px}
  [id^="sec-"],#subsPanel,#buyPanel,#dupPanel,#acctPanel{scroll-margin-top:14px}
  /* Under 1000px there is no room beside the content, so it becomes a scrollable strip on top. */
  @media(max-width:1000px){
    .shell{display:block}
    .sidenav{position:sticky;top:0;z-index:40;width:auto;flex:none;display:flex;gap:6px;overflow-x:auto;
             margin:0 0 12px;border-radius:0;border-left:0;border-right:0;padding:7px 8px;
             -webkit-overflow-scrolling:touch}
    .sidenav a{flex:0 0 auto;white-space:nowrap;font-size:13px;min-height:36px}
    .sidenav .grp{display:none}
  }
  @media(max-width:1000px){ .wrap{max-width:820px} }
  .top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.3px}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(180deg,var(--violet2),var(--violet));display:grid;place-items:center;color:#fff;font-size:15px}
  .brand small{font-weight:700;font-size:12px;color:var(--faint);letter-spacing:.3px;text-transform:uppercase;margin-left:2px}
  .spacer{flex:1}
  button.refresh{border:0;background:var(--violet);color:#fff;font-family:inherit;font-weight:800;font-size:13.5px;
    padding:10px 16px;border-radius:11px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:42px}
  button.refresh:active{transform:translateY(1px)}
  button.refresh[disabled]{opacity:.55;cursor:default}
  .stamp{font-size:12px;color:var(--faint);font-weight:600;width:100%}

  .msg{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:26px 22px;text-align:center;color:var(--body);font-size:15px;line-height:1.55}
  .msg h2{margin:0 0 8px;color:var(--ink);font-size:18px}
  .msg a{color:var(--violet);font-weight:800;text-decoration:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--hair);border-radius:15px;padding:15px 16px}
  .kpi .lab{font-size:11.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:5px;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:12px;color:var(--body);font-weight:600;margin-top:2px}

  .panel{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:18px 18px 20px;margin-bottom:14px}
  .panel h3{margin:0 0 4px;font-size:15px;font-weight:800}
  .panel .hint{margin:0 0 16px;font-size:12.5px;color:var(--faint);font-weight:600}

  .funnel{display:flex;flex-direction:column;gap:11px}
  .fstage{}
  .fstage .frow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .fstage .fname{font-size:13.5px;font-weight:700;color:var(--ink)}
  .fstage .fnum{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .fstage .fnum span{color:var(--faint);font-weight:700;margin-left:6px}
  .track{height:12px;background:#F1EEF9;border-radius:7px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--violet2),var(--violet));transition:width .5s cubic-bezier(.22,.61,.36,1)}

  .rets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ret{background:#FAF8FF;border:1px solid var(--hair);border-radius:13px;padding:14px 15px;text-align:center}
  .ret .rlab{font-size:11.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
  .ret .rpct{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:4px;font-variant-numeric:tabular-nums}
  .ret .rsub{font-size:12px;color:var(--body);font-weight:600;margin-top:1px}
  .ret.dim .rpct{color:var(--faint)}

  .chart{margin-top:4px}
  .legend{display:flex;gap:16px;margin-bottom:10px;font-size:12px;font-weight:700;color:var(--body)}
  .legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  svg{width:100%;height:auto;display:block;overflow:visible}

  /* Ranked bar list: countries, quests, GRIT sources. The bar is the comparison, the number is the
     detail, so the bar sits under the label rather than replacing it. */
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar .brow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
  .bar .bname{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .bval{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
  .bar .bval span{color:var(--faint);font-weight:700;margin-left:6px}
  .bar .btrack{height:8px;background:#F1EEF9;border-radius:5px;overflow:hidden}
  .bar .btrack i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--violet2),var(--violet))}
  .bar.muted .btrack i{background:#C9C2DE}

  /* Tables scroll inside themselves so a wide one never makes the page scroll sideways. */
  .tblwrap{overflow-x:auto;margin:0 -4px}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{text-align:right;font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;
    letter-spacing:.4px;padding:0 8px 8px;white-space:nowrap}
  table.t th:first-child,table.t td:first-child{text-align:left}
  table.t td{text-align:right;padding:8px;border-top:1px solid var(--hair);font-weight:700;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  table.t td.name{font-weight:700;max-width:230px;overflow:hidden;text-overflow:ellipsis}
  table.t td.dim{color:var(--faint);font-weight:600}
  .good{color:#12B76A}.warn{color:#E0A100}.bad{color:#E5484D}
  .note{font-size:12.5px;color:var(--faint);font-weight:600;margin-top:12px}
  .err{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--hair);align-items:flex-start}
  .err:first-of-type{border-top:0}
  .err .emsg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--ink);word-break:break-word;line-height:1.45}
  .err .epage{color:var(--faint);font-weight:600;margin-top:3px;font-family:var(--font);font-size:11.5px}
  .err .emeta{font-size:11px;color:var(--faint);font-weight:700;white-space:nowrap;text-align:right}
  .err .ecount{display:inline-block;background:#FDECEC;color:#C23B3B;font-weight:800;border-radius:8px;padding:1px 7px;margin-bottom:4px}
  .ok-row{color:var(--green);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .foot{font-size:11.5px;color:var(--faint);font-weight:600;text-align:center;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="shell">
<nav class="sidenav" id="sidenav" aria-label="Sections"></nav>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="assets/icons/logo.png" alt="BullQuest" style="width:28px;height:28px;object-fit:contain;display:block;flex:none"> BullQuest <small>Analytics</small></div>
    <div class="spacer"></div>
    <button class="refresh" id="refresh">↻ Refresh</button>
    <div class="stamp" id="stamp"></div>
  </div>
  <div id="root"><div class="msg">Loading…</div></div>
  <div class="foot">
    Privacy-first: no third-party trackers, no cookies, no PII. Just counts of who signed up and who came back.
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var URL_='https://cewumdioknvjtsiolxce.supabase.co';
  var KEY_='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNld3VtZGlva252anRzaW9seGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2OTI3NzUsImV4cCI6MjA5OTI2ODc3NX0.n_r2gixZZTuTyJOiUhCZMpPKp5mUYtdM9bShs-nWkWk';
  var root=document.getElementById('root'), stamp=document.getElementById('stamp'), btn=document.getElementById('refresh');
  var sb=null;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function pct(a,b){ return b>0?Math.round(a/b*100):0; }
  function msg(html){ root.innerHTML='<div class="msg">'+html+'</div>'; }

  function kpi(lab,val,sub){ return '<div class="kpi"><div class="lab">'+esc(lab)+'</div><div class="val">'+esc(val)+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>'; }

  function stage(name,n,base,showPct){
    var p=pct(n,base);
    return '<div class="fstage"><div class="frow"><span class="fname">'+esc(name)+'</span>'+
      '<span class="fnum">'+n+(showPct?'<span>'+p+'% of signups</span>':'')+'</span></div>'+
      '<div class="track"><i style="width:'+Math.max(2,p)+'%"></i></div></div>';
  }

  function retCard(lab,ret,elig,windowTxt){
    if(elig<=0) return '<div class="ret dim"><div class="rlab">'+lab+'</div><div class="rpct">-</div><div class="rsub">collecting data</div></div>';
    return '<div class="ret"><div class="rlab">'+lab+'</div><div class="rpct">'+pct(ret,elig)+'%</div><div class="rsub">'+ret+' of '+elig+' '+windowTxt+'</div></div>';
  }

  function chart(series){
    series=series||[];
    if(!series.length) return '';
    var W=760, H=170, padB=22, padT=8, n=series.length, gw=W/n;
    var max=1; series.forEach(function(d){ max=Math.max(max,d.signups||0,d.active||0); });
    var bars='';
    series.forEach(function(d,i){
      var x=i*gw, bw=Math.min(13,(gw-8)/2), gap=3, cx=x+gw/2;
      var hS=(d.signups||0)/max*(H-padB-padT), hA=(d.active||0)/max*(H-padB-padT);
      var y0=H-padB;
      // active bar (left), signups bar (right)
      bars+='<rect x="'+(cx-bw-gap/2)+'" y="'+(y0-hA)+'" width="'+bw+'" height="'+hA+'" rx="3" fill="#4DA6F5"></rect>';
      bars+='<rect x="'+(cx+gap/2)+'" y="'+(y0-hS)+'" width="'+bw+'" height="'+hS+'" rx="3" fill="#7C5CE6"></rect>';
      var lbl=String(d.day).slice(5); // MM-DD
      if(i%2===0||i===n-1) bars+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="#9AA0AE" font-weight="700">'+esc(lbl)+'</text>';
    });
    return '<div class="legend"><span><b style="background:#7C5CE6"></b>Signups</span><span><b style="background:#4DA6F5"></b>Active users</span></div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily signups and active users, last 14 days">'+bars+'</svg>';
  }

  // ---- generic renderers for the expanded stats ----
  function num(n){ return (n==null||n==='') ? '-' : Number(n).toLocaleString(); }
  /* Ranked bars. `rows` is [{name, val, sub}], scaled against the biggest value rather than a total,
     so a long tail stays readable instead of collapsing to slivers. */
  function bars(rows, opts){
    rows=rows||[]; opts=opts||{};
    if(!rows.length) return '<div class="note">Nothing to show yet.</div>';
    var max=1; rows.forEach(function(r){ max=Math.max(max, Number(r.val)||0); });
    return '<div class="bars">'+rows.map(function(r){
      var w=Math.max(1.5, (Number(r.val)||0)/max*100);
      return '<div class="bar'+(r.muted?' muted':'')+'">'+
        '<div class="brow"><span class="bname">'+esc(r.name)+'</span>'+
        '<span class="bval">'+num(r.val)+(r.sub?'<span>'+esc(r.sub)+'</span>':'')+'</span></div>'+
        '<div class="btrack"><i style="width:'+w+'%"></i></div></div>';
    }).join('')+'</div>';
  }
  /* `cols` is [{h, k, f}] where f optionally formats the cell. Anything null renders as a dim dash,
     never as a zero, because a not-yet-measurable number must not look like a measured zero. */
  function tbl(cols, rows){
    rows=rows||[];
    if(!rows.length) return '<div class="note">Nothing to show yet.</div>';
    var head=cols.map(function(c){ return '<th>'+esc(c.h)+'</th>'; }).join('');
    var body=rows.map(function(r){
      return '<tr>'+cols.map(function(c,i){
        var v=r[c.k];
        if(v==null||v==='') return '<td class="dim">-</td>';
        var txt=c.f?c.f(v,r):num(v);
        return '<td'+(i===0?' class="name"':'')+'>'+esc(txt)+'</td>';
      }).join('')+'</tr>';
    }).join('');
    return '<div class="tblwrap"><table class="t"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
  }
  function panel(id, title, hint, body){
    return '<div id="'+id+'" class="panel"><h3>'+esc(title)+'</h3>'+
      (hint?'<p class="hint">'+esc(hint)+'</p>':'')+body+'</div>';
  }
  /* Stacked two-series day chart: real signups against accounts from that same day since banned. */
  function stackChart(series, aKey, bKey, aLab, bLab){
    series=series||[]; if(!series.length) return '';
    var W=760,H=170,padB=22,padT=8,n=series.length,gw=W/n,max=1;
    series.forEach(function(d){ max=Math.max(max,(Number(d[aKey])||0)+(Number(d[bKey])||0)); });
    var bars='';
    series.forEach(function(d,i){
      var cx=i*gw+gw/2, bw=Math.min(20,gw-8), y0=H-padB;
      var a=(Number(d[aKey])||0)/max*(H-padB-padT), b=(Number(d[bKey])||0)/max*(H-padB-padT);
      bars+='<rect x="'+(cx-bw/2)+'" y="'+(y0-a)+'" width="'+bw+'" height="'+a+'" rx="3" fill="#7C5CE6"></rect>';
      bars+='<rect x="'+(cx-bw/2)+'" y="'+(y0-a-b)+'" width="'+bw+'" height="'+b+'" rx="3" fill="#E5484D" opacity=".72"></rect>';
      var lbl=String(d.day).slice(5);
      if(i%2===0||i===n-1) bars+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="#9AA0AE" font-weight="700">'+esc(lbl)+'</text>';
    });
    return '<div class="legend"><span><b style="background:#7C5CE6"></b>'+esc(aLab)+'</span>'+
      '<span><b style="background:#E5484D;opacity:.72"></b>'+esc(bLab)+'</span></div>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aLab+' and '+bLab+' by day')+'">'+bars+'</svg>';
  }

  function fmtTime(t){ try{ return new Date(t).toLocaleString(); }catch(e){ return ''; } }
  function errPanel(errs){
    errs=errs||[];
    var head='<div class="panel"><h3>Recent errors</h3><p class="hint">Uncaught JS errors from real sessions, last 7 days. Grouped by signature.</p>';
    if(!errs.length) return head+'<div class="ok-row">✓ No errors reported. All clear.</div></div>';
    var rows=errs.map(function(e){
      return '<div class="err"><div class="emsg">'+esc(e.message)+'<div class="epage">'+esc(e.page||'')+'</div></div>'+
        '<div class="emeta"><span class="ecount">×'+(e.count||1)+'</span><br>'+esc(fmtTime(e.last_seen))+'</div></div>';
    }).join('');
    return head+rows+'</div>';
  }

  function notifyPanel(){
    var inp='padding:9px 11px;border:1px solid rgba(120,120,140,.35);border-radius:9px;font:inherit;font-size:14px;background:#fff;color:#20143A;width:100%;box-sizing:border-box';
    return '<div class="panel"><h3>Send a notification</h3><p class="hint">Broadcast news to everyone, or message one player. It shows in their in-app notification bell.</p>'
      +'<div style="display:flex;flex-direction:column;gap:9px">'
      +'<input id="nfTitle" maxlength="140" placeholder="Title, e.g. New season is live" style="'+inp+'">'
      +'<textarea id="nfBody" maxlength="2000" rows="3" placeholder="Your message to players..." style="'+inp+';resize:vertical"></textarea>'
      +'<div style="display:flex;gap:9px;flex-wrap:wrap">'
      +'<select id="nfKind" style="'+inp+';width:auto"><option value="news">News</option><option value="update">Update</option><option value="personal">Personal</option></select>'
      +'<input id="nfTo" placeholder="To: leave blank for everyone, or a player email / id" style="'+inp+';flex:1;min-width:200px;width:auto">'
      +'</div>'
      +'<div style="display:flex;align-items:center;gap:12px"><button id="nfSend" class="refresh" style="cursor:pointer">Send</button><span id="nfMsg" style="font-size:13px;font-weight:600"></span></div>'
      +'</div></div>';
  }
  function wireNotify(){
    var b=document.getElementById('nfSend'); if(!b) return;
    b.addEventListener('click', function(){
      var t=(document.getElementById('nfTitle').value||''), body=(document.getElementById('nfBody').value||''),
          k=document.getElementById('nfKind').value, to=(document.getElementById('nfTo').value||'');
      var m=document.getElementById('nfMsg');
      if(!t.trim()||!body.trim()){ m.style.color='#E5484D'; m.textContent='Title and message are required.'; return; }
      b.setAttribute('disabled',''); m.style.color='#78808F'; m.textContent='Sending...';
      sb.rpc('admin_send_notice',{p_title:t,p_body:body,p_kind:k,p_to:to.trim()||null}).then(function(r){
        b.removeAttribute('disabled'); var d=r&&r.data;
        if(r.error||(d&&d.error)){ m.style.color='#E5484D'; m.textContent=(r.error&&r.error.message)||(d&&d.error)||'Failed to send.'; return; }
        m.style.color='#12B76A'; m.textContent='Sent to '+((d&&d.audience)||'everyone')+'.';
        document.getElementById('nfTitle').value=''; document.getElementById('nfBody').value=''; document.getElementById('nfTo').value='';
      }, function(){ b.removeAttribute('disabled'); m.style.color='#E5484D'; m.textContent='Failed to send.'; });
    });
  }
  function acctInp(){ return 'padding:9px 11px;border:1px solid rgba(120,120,140,.35);border-radius:9px;font:inherit;font-size:14px;background:#fff;color:#20143A;min-width:190px'; }
  function loadAccounts(){
    var el=document.getElementById('acctPanel'); if(!el) return;
    el.innerHTML='<div class="panel"><h3>Players &amp; accounts</h3><p class="hint">Loading…</p></div>';
    sb.rpc('admin_accounts').then(function(r){
      if(r.error){ el.innerHTML='<div class="panel"><h3>Players &amp; accounts</h3><p class="hint" style="color:#E5484D">'+esc(r.error.message||'error')+'</p></div>'; return; }
      var rows=r.data||[];
      var trs=rows.map(function(a){
        return '<tr style="border-top:1px solid rgba(120,120,140,.15)"><td style="font-family:monospace;font-size:11px;padding:6px 8px">'+esc(String(a.id).slice(0,8))+'</td>'
          +'<td style="padding:6px 8px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(a.email)+'">'+esc(a.email)+'</td>'
          +'<td style="padding:6px 8px">'+esc(a.signup)+'</td><td style="padding:6px 8px">'+(a.grit||0)+'</td><td style="padding:6px 8px">'+(a.bulls||0)+'</td>'
          +'<td style="padding:6px 8px">'+esc(a.wallet||'-')+'</td><td style="padding:6px 8px">'+esc(a.telegram||'-')+'</td><td style="padding:6px 8px">'+esc(a.last_active||'-')+'</td></tr>';
      }).join('');
      /* rows.length is the RPC's 1000-row cap, not a player count: the badge read "1000" against
         1,158 live players. Ask for the real total separately and label the list as a sample. */
      sb.rpc('admin_accounts_count').then(function(cr){

  function wireMerge(){

      b.setAttribute('disabled',''); m.style.color='#78808F'; m.textContent='Merging…';
      sb.rpc('admin_merge',{p_keep:keep,p_drop:drop}).then(function(r){
        b.removeAttribute('disabled'); var d=r&&r.data;

        m.style.color='#12B76A'; m.textContent='Merged. Keeper now has '+((d&&d.keep_bulls)!=null?d.keep_bulls:'?')+' bulls; '+((d&&d.free_bulls_returned)||0)+' free bull(s) returned to the pool.';
        document.getElementById('mgKeep').value=''; document.getElementById('mgDrop').value='';
        setTimeout(loadAccounts, 700);
      }, function(){ b.removeAttribute('disabled'); m.style.color='#E5484D'; m.textContent='Merge failed.'; });
    });

  function wireBulkCheck(){
    function run(dry){
      var out=document.getElementById('subAuto');
      var a=document.getElementById('subCheckDry'), b=document.getElementById('subCheckRun');
      if(a) a.setAttribute('disabled',''); if(b) b.setAttribute('disabled','');
      if(out){ out.style.color=''; out.textContent = dry ? 'Checking every pending tweet, no changes yet...' : 'Checking and applying, this can take a minute...'; }
      sb.auth.getSession().then(function(sess){
        var tok=(sess&&sess.data&&sess.data.session&&sess.data.session.access_token)||'';
        return fetch(URL_+'/functions/v1/verify-tweets',{
          method:'POST',
          headers:{'Content-Type':'application/json','apikey':KEY_,'Authorization':'Bearer '+tok},
          /* The function defaults to 500 a run. After a mass requeue the backlog is larger than
             that, and a half-done queue looks like the checker silently skipped people. Ask for
             its maximum so one click clears everything. */
          body:JSON.stringify({dryRun:dry, limit:1000})
        });
      }).then(function(r){ return r.json(); }).then(function(j){
        if(a) a.removeAttribute('disabled'); if(b) b.removeAttribute('disabled');
        if(!out) return;
        if(j.error){ out.style.color='#E5484D'; out.textContent='Failed: '+(j.detail||j.error); return; }
        var lines=Object.keys(j.breakdown||{}).map(function(k){ return j.breakdown[k]+' '+k; }).join(' | ');
        out.style.color='#12B76A';
        out.textContent=(j.dryRun?'PREVIEW, nothing changed. ':'Applied. ')+
          'checked '+j.checked+', approve '+j.approved+', reject '+j.rejected+', left pending '+j.stillPending+
          (lines?('  ('+lines+')'):'');
        if(!j.dryRun) setTimeout(loadSubmissions, 1200);
      }).catch(function(e){
        if(a) a.removeAttribute('disabled'); if(b) b.removeAttribute('disabled');
        if(out){ out.style.color='#E5484D'; out.textContent='Failed: '+e.message; }
      });
    }
    var d=document.getElementById('subCheckDry'), rn=document.getElementById('subCheckRun');
    if(d) d.addEventListener('click', function(){ run(true); });
    if(rn) rn.addEventListener('click', function(){
      if(confirm('Approve and reject every pending submission automatically? Approved players get paid immediately.')) run(false);
    });
  }
  function wireSubmissions(){
    function review(id, approve, btn){
      var m=document.getElementById('subMsg'); btn.setAttribute('disabled','');
      sb.rpc('admin_review_submission',{p_id:id,p_approve:approve}).then(function(r){
        var d=r&&r.data;
        if(r.error||(d&&d.error)){ if(m){ m.style.color='#E5484D'; m.textContent=(r.error&&r.error.message)||(d&&d.error)||'Failed.'; } btn.removeAttribute('disabled'); return; }
        if(m){ m.style.color='#12B76A'; m.textContent=approve?('Approved, paid '+((d&&d.reward)||'')+' GRIT.'):'Rejected.'; }
        var row=btn.closest('.subrow'); if(row) row.remove();
      }, function(){ if(m){ m.style.color='#E5484D'; m.textContent='Failed.'; } btn.removeAttribute('disabled'); });
    }
    [].forEach.call(document.querySelectorAll('.subApprove'), function(b){ b.addEventListener('click', function(){ review(b.getAttribute('data-id'), true, b); }); });
    [].forEach.call(document.querySelectorAll('.subReject'), function(b){ b.addEventListener('click', function(){ if(confirm('Reject this submission? The player can submit a new tweet.')) review(b.getAttribute('data-id'), false, b); }); });
  }

  function wireDupSweep(){
    /* Calls the farm_ban RPC, not the edge function. The edge function read users and device
       signals through PostgREST, which caps a response at 1000 rows, so it banned 649 while 1065
       accounts sat on the very domains it was told to catch. SQL sees the whole table. */
    function run(dry){
      var out=document.getElementById('dupSweepOut');
      var a=document.getElementById('dupSweepDry'), b=document.getElementById('dupSweepRun');
      if(a) a.setAttribute('disabled',''); if(b) b.setAttribute('disabled','');
      if(out){ out.style.color=''; out.textContent = dry ? 'Scanning every account...' : 'Banning and clawing back...'; }
      var min=parseInt((document.getElementById('dupMin')||{}).value,10)||5;
      sb.rpc('farm_ban', { p_dry: !!dry, p_min_cluster: min }).then(function(r){
        if(a) a.removeAttribute('disabled'); if(b) b.removeAttribute('disabled');
        if(!out) return;
        var j = r && r.data;
        if(r && r.error){ out.style.color='#E5484D'; out.textContent='Failed: '+r.error.message; return; }
        if(!j || j.error){ out.style.color='#E5484D'; out.textContent='Failed: '+((j&&j.error)||'no result'); return; }
        out.style.color='#12B76A';
        out.textContent=(j.dry?'PREVIEW, nothing changed. ':'Done. ')+
          ((j.bots||0)+(j.farm_runners||0))+' accounts ('+(j.bots||0)+' bots + '+(j.farm_runners||0)+' farm runners), '+
          (j.bulls_released||0)+' bulls back, '+(j.grit_removed||0)+' GRIT removed, '+
          'clawback '+(j.grit_clawed_back||0)+' GRIT from '+(j.referrers_charged||0)+' referrers'+
          ((j.spared_because_proven_human||0)?('. Spared '+j.spared_because_proven_human+' proven human accounts.'):'.');
        if(!j.dry) setTimeout(function(){ loadDuplicates(); load(); }, 1500);
      }).catch(function(e){
        if(a) a.removeAttribute('disabled'); if(b) b.removeAttribute('disabled');
        if(out){ out.style.color='#E5484D'; out.textContent='Failed: '+e.message; }
      });
    }
    var d=document.getElementById('dupSweepDry'), rn=document.getElementById('dupSweepRun');
    if(d) d.addEventListener('click', function(){ run(true); });
    if(rn) rn.addEventListener('click', function(){
      var min=parseInt((document.getElementById('dupMin')||{}).value,10)||5;
      if(confirm('Ban every account with hard proof of farming (same-second signup bursts of '+min+'+, bulk-registered domains, duplicate gmail mailboxes), return their bulls, strip their GRIT, and reverse referral payouts made for them? Proven human accounts are skipped. This is reversible.')) run(false);
    });
  }
  /* ---- Enforcement ----

     then the bull sits in custody so Clear gives back the same animal, not a replacement. */
  function loadEnforcement(){
    var el=document.getElementById('enfPanel'); if(!el) return;
    sb.rpc('admin_enforcement_queue').then(function(r){
      var d=r&&r.data; if(!d || d.error){ el.innerHTML=''; return; }

        '<div class="grid">'+kpi('Restricted', c.restricted||0, 'awaiting your call')+

             04:00 cannot be re-derived from live data once it is over, so accounts banned by one

        '</div>';
      if(!rows.length) h+='<p class="hint" style="margin-top:10px">Nothing waiting on you.</p>';
      rows.forEach(function(x){
        var e=x.evidence||{}, b=e.behaviour||{};
        h+='<div style="border-top:1px solid rgba(20,16,40,.08);padding:12px 2px">'+
          '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">'+
            '<b style="font-size:13.5px">'+esc(x.username||'')+'</b>'+
            '<span style="font-size:11.5px;opacity:.7">'+esc(x.email||'')+'</span>'+

            (x.proven_human?'<span style="font-size:11px;padding:3px 8px;border-radius:999px;background:#E7F7EE;color:#1E9E52">proven human</span>':'')+
            (x.bulls_in_custody?'<span style="font-size:11px;padding:3px 8px;border-radius:999px;background:#EEF1F6;color:#5a6273">'+x.bulls_in_custody+' bull in custody</span>':'')+

      function sweep(dry){
        var o=document.getElementById('enfOut'); if(o){ o.style.color=''; o.textContent='Scanning...'; }
        sb.rpc('farm_restrict',{p_dry:!!dry, p_min_cluster:5}).then(function(rr){
          var j=rr&&rr.data;
          if(!o) return;
          if(rr&&rr.error){ o.style.color='#E5484D'; o.textContent='Failed: '+rr.error.message; return; }
          if(!j||j.error){ o.style.color='#E5484D'; o.textContent='Failed: '+((j&&j.error)||'no result'); return; }
          o.style.color='#12B76A';
          o.textContent=(j.dry?'Preview: ':'Done: ')+j.would_restrict+' account(s) restricted, '+j.spared_proven_humans+' proven humans skipped. Nothing was taken.';
          if(!j.dry) setTimeout(loadEnforcement, 1200);

      var a=document.getElementById('enfDry'), bb=document.getElementById('enfRun');

      if(bb) bb.addEventListener('click', function(){ if(confirm('Restrict every account the current rules condemn? Nothing is taken from anyone: they keep their bull and GRIT and can keep playing until you decide.')) sweep(false); });

      function bulk(action, ask){
        var o=document.getElementById('enfBulkOut'); if(!confirm(ask)) return;
        if(o){ o.style.color=''; o.textContent='Working through the queue...'; }
        sb.rpc('admin_enforcement_bulk',{p_action:action,p_max:500}).then(function(rr){
          var j=rr&&rr.data;
          if(!o) return;
          if((rr&&rr.error)||!j||j.error){ o.style.color='#E5484D'; o.textContent='Failed: '+((rr&&rr.error&&rr.error.message)||(j&&j.error)||'no result'); return; }
          o.style.color='#12B76A';

          setTimeout(loadEnforcement, 1200);

      var bkb=document.getElementById('enfBulkBan'), bkc=document.getElementById('enfBulkClear');
      if(bkb) bkb.addEventListener('click', function(){ bulk('confirm_condemned',
        'Confirm the ban on every restricted account the current rules STILL condemn?\n\nEach bull goes into custody, so Clear can hand back the exact same animal later. Accounts the rules no longer condemn are not touched.'); });
      if(bkc) bkc.addEventListener('click', function(){ bulk('clear_uncondemned',
        'Release every restricted account the current rules NO LONGER condemn?\n\nThey get everything back and are marked so no future sweep can catch them again.'); });

      function act(btn, fn, label){
        var u=btn.getAttribute('data-u'), m=btn.parentNode.querySelector('.enfMsg');
        var note = fn==='admin_confirm_ban' ? (prompt('Optional note for the record (required if the account has proved it is a person):')||'') : 'reviewed in admin';
        btn.setAttribute('disabled',''); if(m){ m.style.color=''; m.textContent='Working...'; }
        sb.rpc(fn, fn==='admin_confirm_ban' ? {p_user:u,p_note:note} : {p_user:u,p_note:note}).then(function(rr){
          var j=rr&&rr.data;
          if(j&&j.ok){ if(m){ m.style.color='#12B76A'; m.textContent=label; } setTimeout(loadEnforcement, 1200); }
          else { btn.removeAttribute('disabled'); if(m){ m.style.color='#E5484D'; m.textContent=(j&&j.error)||'Failed.'; } }

  /* ---- Ban appeals ----

  function loadAppeals(){

  // ---- Duplicate accounts: auto-flagged, appealable, reviewed here ----

      navCount('dupPanel', (c.open||0)+(c.appealed||0));
      var h='<div class="panel"><h3>Duplicate accounts</h3>'+
            '<p class="hint">Auto-flagged when a newer account signs in from the same browser, or the same IP <em>and</em> device, as an older one. Only the newer account is flagged, and it can still play. Clearing one lets its referral pay on the next refresh.</p>'+
            '<div class="grid">'+kpi('Awaiting review', c.open||0)+kpi('Appealed', c.appealed||0, 'player replied')+

            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 4px">'+
              '<button id="dupSweepDry" style="cursor:pointer;background:#4DA6F5;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:800;min-height:44px">Sweep now (preview)</button>'+

                +' or more</label>'+
              '<span class="hint" style="font-size:12px;flex-basis:100%;margin:0">The sweep bans on proof only: accounts created within the same 10 seconds under one referrer, bulk-registered mail domains, and gmail addresses that are the same mailbox with dots or +tags. Shared IP and phone model are <b>not</b> used, they banned 539 real players on 2026-08-02.</span>'+

      var seenDecided=false;

        }
        h+='<div class="duprow" style="border-top:1px solid rgba(20,16,40,.08);padding:11px 2px">'+
           '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">'+

             '<span style="font-size:11.5px;opacity:.7">'+esc(x.email||'')+'</span>'+
             '<span style="font-size:11px;padding:3px 8px;border-radius:999px;background:'+
               (appealed?'#FFF3D6;color:#6b4a05':(x.status==='cleared'?'#E7F7EE;color:#1E9E52':(x.status==='confirmed'?'#FDEDEE;color:#B42318':'#EEF1F6;color:#5a6273')))+'">'+esc(x.status)+'</span>'+
             '<span style="font-size:11.5px;opacity:.7">'+esc(x.reason)+' as <b>'+esc(x.matched_who||'?')+'</b></span>'+
             '<span style="font-size:11.5px;opacity:.7">'+(x.referral_count||0)+' referrals &middot; '+(x.grit||0)+' GRIT</span>'+
           '</div>';
        if(x.appeal_text){
          h+='<div style="margin-top:7px;padding:9px 11px;background:rgba(20,16,40,.04);border-radius:10px;font-size:12.5px;line-height:1.5">'+
             '<span style="opacity:.6;font-size:11px;display:block;margin-bottom:2px">Their explanation</span>'+esc(x.appeal_text)+'</div>';
        }
        if(x.status==='auto' || appealed){
          h+='<div style="display:flex;gap:8px;margin-top:8px">'+
             '<button class="dupClear refresh" data-u="'+esc(x.user_id)+'" style="cursor:pointer;background:#12B76A">Clear, pay them</button>'+
             '<button class="dupBan" data-u="'+esc(x.user_id)+'" style="cursor:pointer;background:#E5484D;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:700;font:inherit">Confirm duplicate</button></div>';

          else { if(m){ m.style.color='#E5484D'; m.textContent='Failed.'; } btn.removeAttribute('disabled'); }

  /* Let a panel refresh its own badge once its data arrives, since those load after render. */
  function navCount(id, n){
    var b=document.querySelector('.sidenav [data-count="'+id+'"]'); if(!b) return;
    if(n){ b.textContent=n; b.style.display=''; } else { b.style.display='none'; }
  }
  function spy(){
    var links=[].slice.call(document.querySelectorAll('.sidenav a'));
    if(!links.length) return;
    function pick(){
      var best=null, bestTop=-Infinity;
      links.forEach(function(a){
        var el=document.getElementById(a.getAttribute('data-sec'));
        if(!el) return;
        var t=el.getBoundingClientRect().top - 80;
        if(t<=0 && t>bestTop){ bestTop=t; best=a; }
      });
      if(!best) best=links[0];
      links.forEach(function(a){ a.classList.toggle('on', a===best); });
    }
    if(spy._on) window.removeEventListener('scroll', spy._on);
    spy._on = pick;
    window.addEventListener('scroll', pick, {passive:true});
    pick();
  }

    '<p class="hint">The red band is how much of that day turned out to be a farm. It is the single most honest growth chart on this page.</p>'+
    '<div class="chart">'+stackChart(d.series_real_vs_banned,'real','banned','Real players','Banned since')+'</div>';
    h += panel('sec-growth','Growth','Where players come from, and how much of each day was real.', growth);

    // ---- funnel on live accounts ----
    var fl=d.funnel_live||{}, steps=(fl.steps||[]), base=(steps[0]&&steps[0].players)||0;
    var fun = '<div class="funnel">'+steps.map(function(s,i){
      return stage(s.step, s.players, base, i>0);
    }).join('')+'</div>'+
    '<p class="note">'+num(fl.dueled_but_skipped_quests)+' players fought a duel without ever finishing a quest, so the quest step is a detour rather than a wall.</p>'+
    '<h3 style="margin:22px 0 4px;font-size:15px;font-weight:800">Players who joined today</h3>'+
    '<p class="hint">The same funnel for the last 24 hours. This one keeps working once the all-time figure goes stale.</p>'+
    '<div class="funnel">'+(d.funnel_new_24h||[]).map(function(s,i){
      var b=((d.funnel_new_24h||[])[0]||{}).players||0;
      return stage(s.step, s.players, b, i>0);
    }).join('')+'</div>';
    h += panel('sec-funnel-live','Signup to first duel','Live accounts only, so a banned farm cannot flatter the funnel.', fun);

    // ---- retention ----
    var rw=d.retention_window||{}, nb=d.never_came_back||{};
    var ret = '<div class="grid">'+
      kpi('Played this week', num(d.active_this_week), 'last 7 days')+
      kpi('Never came back', num(nb.never_came_back), (nb.never_came_back_pct||0)+'% of those who could')+
      kpi('Tracking since', String(rw.tracking_since||'-'), (rw.days_tracked||0)+' days of data')+
      kpi('Under a week old', (rw.players_under_7_days_old_pct||0)+'%', 'of live players')+
    '</div>'+
    '<h3 style="margin:18px 0 4px;font-size:15px;font-weight:800">Retention by signup day</h3>'+
    '<p class="hint">Share of that day’s signups who came back by each later day. A dash means that day has not happened yet, not zero.</p>'+
    tbl([{h:'Signed up',k:'signup_day'},{h:'Players',k:'signed_up'},
         {h:'D1',k:'d1',f:function(v){return v+'%';}},{h:'D2',k:'d2',f:function(v){return v+'%';}},
         {h:'D3',k:'d3',f:function(v){return v+'%';}},{h:'D4',k:'d4',f:function(v){return v+'%';}},
         {h:'D5',k:'d5',f:function(v){return v+'%';}},{h:'D6',k:'d6',f:function(v){return v+'%';}}],
        d.came_back_by_signup_day||[])+
    '<h3 style="margin:22px 0 4px;font-size:15px;font-weight:800">Login streaks</h3>'+
    '<p class="hint">A streak counter freezes at the last claim, so "still going" is the column that means anything.</p>'+
    tbl([{h:'Streak',k:'bucket'},{h:'Players',k:'players'},{h:'Still going',k:'still_going'}], d.login_streaks||[]);
    h += panel('sec-retention-2','Retention','Live accounts, measured from the day activity tracking began.', ret);

    // ---- quests ----
    h += panel('sec-quests','Quests, weakest first',
      'Share of live players who finished each one. The quests at the top are the ones nobody is doing.',
      tbl([{h:'Quest',k:'title'},{h:'Reward',k:'reward_grit'},{h:'Finished by',k:'done_by'},
           {h:'Of players',k:'pct_of_players',f:function(v){return v+'%';}},
           {h:'Live',k:'live',f:function(v){return v?'yes':'no';}}], d.quests_weakest_first||[]));

    // ---- GRIT economy ----
    var gs=d.grit_supply||{}, gf=d.grit_flow||{}, gd=d.grit_distribution||{},
        gb=d.grit_on_banned_accounts||{}, gg=d.grit_ledger_gap||{}, du=d.duels||{};
    var econ = '<div class="grid">'+
      kpi('GRIT held', num(gs.held_now), 'by live players')+
      kpi('Ever earned', num(gs.ever_earned), (gs.spent_pct||0)+'% has been spent')+
      kpi('Minted today', num(gf.minted_today), 'burned '+num(gf.burned_today))+
      kpi('Net last 7 days', num(gf.net_7d), '+'+(gf.net_7d_pct_of_supply||0)+'% of all GRIT')+
    '</div>'+
    '<div class="grid">'+
      kpi('Median balance', num(gd.median), 'p90 is '+num(gd.p90))+
      kpi('Top 10% hold', (gd.top_10_pct_share||0)+'%', 'of all GRIT')+
      kpi('Duels today', num(du.duels_today), num(du.avg_duels_per_dueller_today)+' each')+
      kpi('Unexplained GRIT', num(gg.unexplained_grit), num(gg.players_affected)+' players off-ledger')+
    '</div>'+
    '<h3 style="margin:18px 0 4px;font-size:15px;font-weight:800">Where GRIT comes from</h3>'+
    bars((d.grit_earn_sources||[]).map(function(r){
      return {name:r.reason, val:r.grit, sub:num(r.events)+' times', muted:(r.kind!=='gameplay')};
    }))+
    '<h3 style="margin:22px 0 4px;font-size:15px;font-weight:800">Where GRIT goes</h3>'+
    '<p class="hint">Faded bars are enforcement, not players choosing to spend.</p>'+
    bars((d.grit_spend_sinks||[]).map(function(r){
      return {name:r.reason, val:r.grit, sub:num(r.events)+' times', muted:(r.kind!=='player spend')};
    }))+
    '<p class="note">Banned accounts earned '+num(gb.grit_they_ever_earned)+' GRIT before being caught, and '+
      num(gb.clawed_back)+' has been taken back.</p>';
    h += panel('sec-economy','GRIT economy','Live players only. The net figure is the inflation number to watch.', econ);

    // ---- real money ----
    var sr=d.sol_revenue||{}, mm=d.marketplace_money||{}, pp=d.paying_players||{};
    var money = '<div class="grid">'+
      kpi('SOL to treasury', num(sr.total_sol), 'our cut, all time')+
      kpi('Last 7 days', num(sr.last_7d_sol), 'SOL')+
      kpi('Paying players', num(pp.paying_players), (pp.pct_of_live||0)+'% of players')+
      kpi('Came back to pay', num(pp.repeat_payers), 'more than once')+
    '</div>'+
    tbl([{h:'Source',k:'source'},{h:'Payments',k:'payments'},{h:'SOL',k:'sol'}], sr.by_source||[])+
    '<p class="note">Marketplace: '+num(mm.sales)+' sales, '+num(mm.volume_sol)+' SOL of volume, '+
      num(mm.sold_by_us)+' sold by us and '+num(mm.player_to_player)+' player to player.</p>';
    h += panel('sec-money','Real money','Every SOL that reached the treasury, and who paid it.', money);

    // ---- bulls ----
    var bs=d.bull_supply||{}, rn=d.free_bull_runway||{}, bp=d.bulls_per_player||{},
        ml=d.market_listings||{}, nbull=d.players_without_a_bull||{};
    var runwayCls = (rn.days_left_at_7d_rate!=null && Number(rn.days_left_at_7d_rate)<3) ? 'bad' : '';
    var bull = '<div class="grid">'+
      kpi('Free bulls left', num(rn.free_bulls_left), 'of 5,000 in Gen 1')+
      kpi('Days of supply', (rn.days_left_at_7d_rate==null?'-':rn.days_left_at_7d_rate), 'at '+num(rn.avg_per_day_7d)+' a day')+
      kpi('Claimed today', num(rn.claimed_last_24h))+
      kpi('Returned by bans', num(rn.returned_by_bans), 'back in the pool')+
    '</div>'+
    (runwayCls==='bad' ? '<p class="note bad" style="font-weight:800">Gen 1 runs dry in about '+rn.days_left_at_7d_rate+' days at the current rate. After that a new player gets nothing to claim.</p>' : '')+
    '<div class="grid">'+
      kpi('Held', num(bs.held), (bs.pct_held||0)+'% of all bulls')+
      kpi('Players with none', num(nbull.no_bull), num(nbull.signed_up_today)+' joined today')+
      kpi('More than one', num(bp.more_than_one), 'biggest holds '+num(bp.biggest_collection))+
      kpi('For sale now', num(ml.active_listings), 'from '+num(ml.sellers)+' sellers')+
    '</div>'+
    (Number(bs.flag_mismatch)>0
      ? '<p class="note bad" style="font-weight:800">'+num(bs.flag_mismatch)+' bulls disagree between the claimed flag and who actually holds them. That is a data bug worth fixing.</p>'
      : '<p class="note">Ownership is consistent: the claimed flag and the holder table agree on all 5,000 bulls.</p>')+
    '<h3 style="margin:18px 0 4px;font-size:15px;font-weight:800">Which rarities are taken</h3>'+
    tbl([{h:'Band',k:'band'},{h:'Held',k:'held'},{h:'Total',k:'total'},
         {h:'Taken',k:'pct_held',f:function(v){return v+'%';}}], d.rarity_bands_held||[]);
    h += panel('sec-bulls','Bulls','Supply, who holds them, and how long Gen 1 lasts.', bull);

    // ---- health ----
    var bl=d.bans_last_24h||{}, rq=d.review_queue||{}, ce=d.client_errors_24h||{},
        aw=d.airdrop_wallets||{}, tb=d.telemetry_blind_spot||{};
    var health = '<div class="grid">'+
      kpi('Banned today', num(bl.banned_24h), num(bl.with_logged_rule)+' with a logged rule')+
      kpi('Restricted today', num(bl.restricted_24h))+
      kpi('Waiting on you', num(rq.total_waiting), num(rq.duplicate_flags_open)+' flags, '+num(rq.ban_appeals_open)+' appeals')+
      kpi('Invisible to anti-farm', num(tb.invisible), (tb.pct_invisible||0)+'% of players')+
    '</div>'+
    '<div class="grid">'+
      kpi('Airdrop wallet set', num(aw.wallet_registered), (aw.pct_registered||0)+'% of players')+
      kpi('Cannot be paid', num(aw.not_registered), 'no wallet on file')+
      kpi('Farm payout rows', num(aw.rows_on_banned), 'must stay out of any weight')+
      kpi('Errors today', num(ce.total_hits_24h), num(ce.distinct_errors_24h)+' distinct')+
    '</div>'+
    (bl.top_rules && bl.top_rules.length
      ? '<h3 style="margin:18px 0 4px;font-size:15px;font-weight:800">What today’s bans were for</h3>'+
        '<p class="hint">Only '+num(bl.with_logged_rule)+' of '+num(bl.banned_24h)+' carry a logged rule, so this is a slice and not the whole picture.</p>'+
        bars(bl.top_rules.map(function(r){ return {name:r.rule, val:r.accounts}; }))
      : '')+
    (ce.worst && ce.worst.length
      ? '<h3 style="margin:22px 0 4px;font-size:15px;font-weight:800">Worst errors today</h3>'+
        tbl([{h:'Message',k:'message'},{h:'Page',k:'page'},{h:'Hits',k:'hits'}], ce.worst)
      : '');
    h += panel('sec-health','Health and integrity','Enforcement load, the review queue, and the gaps in what we can see.', health);

    return h;
  }

  function render(d){
    var html='';
    html+='<div id="sec-notify">'+notifyPanel()+'</div>';   // admin: send news / personal notifications to players
    html+='<div id="subsPanel"></div>';   // manual review of tweet submissions
    // KPIs
    /* Real first. The raw totals counted a bot farm as growth on 2026-08-01, so the honest number
       has to be the one your eye lands on. */
    html+='<div id="sec-stats"><div class="grid">'+
      kpi('Real users', d.real_users, 'excludes banned')+
      kpi('Real signups today', d.real_signups_today)+
      kpi('Active today', d.dau_today, 'unique opens')+
      kpi('Played today', d.played_today, 'actually earned GRIT')+
      kpi('Avg daily (7d)', d.dau_7d_avg)+
    '</div>';
    html+='<div class="grid">'+
      kpi('Banned total', d.banned_total, 'multi-account')+
      kpi('Banned today', d.banned_today)+
      kpi('Signed up, never played', d.never_played)+
      kpi('Flags awaiting you', d.flags_awaiting, (d.flags_appealed||0)+' appealed')+
      kpi('Tweets pending', d.submissions_pending)+
    '</div>';
    html+='<div class="grid">'+
      kpi('Total incl. banned', d.users_total, 'raw signups')+
      kpi('Signups today (raw)', d.signups_today)+
      kpi('Signups 7d (raw)', d.signups_7d)+
      kpi('Referral GRIT pending', d.referral_grit_pending, 'not yet paid')+
      kpi('Bulls left in pool', d.bulls_free)+
    '</div></div>';
    if(d.top_referrers_24h && d.top_referrers_24h.length){
      html+='<div id="sec-referrers" class="panel"><h3>Top referrers, last 24h</h3>'+
        '<p class="hint">A single link bringing in hundreds of accounts is the shape of a farm, not word of mouth. The banned column tells you which.</p>';
      d.top_referrers_24h.forEach(function(r){
        var bad = Number(r.banned_share)||0, n = Number(r.brought_in)||0;
        var pct = n ? Math.round(bad*100/n) : 0;
        html+='<div style="display:flex;gap:10px;align-items:center;border-top:1px solid rgba(20,16,40,.08);padding:9px 2px">'+
          '<b style="flex:1">'+esc(String(r.who))+'</b>'+
          '<span style="font-weight:800">'+n+' invited</span>'+
          '<span style="font-weight:800;color:'+(pct>=50?'#E5484D':(pct>0?'#E0A100':'#12B76A'))+'">'+bad+' banned ('+pct+'%)</span>'+
        '</div>';
      });
      html+='</div>';
    }

    // Errors (prominent - if something's broken you see it right away)
    html+='<div id="sec-errors">'+errPanel(d.recent_errors)+'</div>';

    html+='<div id="buyPanel"></div>';   // what players actually paid for
    html+='<div id="enfPanel"></div>';   // restricted + contested accounts waiting on a human
    html+='<div id="appealPanel"></div>';// players telling us the ban was wrong
    html+='<div id="dupPanel"></div>';   // auto-flagged duplicate accounts + appeals

    // Funnel
    var su=d.funnel_signed_up||0;
    html+='<div id="sec-funnel" class="panel"><h3>Activation funnel</h3><p class="hint">How far each signup gets. Lifetime, all users.</p><div class="funnel">'+
      stage('Signed up', su, su, false)+
      stage('Played a duel', d.funnel_dueled||0, su, true)+
      stage('Came back another day', d.funnel_returned||0, su, true)+
    '</div></div>';

    // Retention
    html+='<div id="sec-retention" class="panel"><h3>Retention</h3><p class="hint">Of users who signed up after tracking began ('+esc(d.measuring_since)+'), how many returned.</p><div class="rets">'+
      retCard('D1 return', d.d1_retained||0, d.d1_eligible||0, 'came back next day')+
      retCard('D7 return', d.d7_retained||0, d.d7_eligible||0, 'back within 7 days')+
    '</div></div>';

    // Chart
    html+='<div id="sec-chart" class="panel"><h3>Last 14 days</h3><p class="hint">Daily signups vs unique active users. This one counts banned accounts, which is why the live twin sits under Growth.</p><div class="chart">'+chart(d.series)+'</div></div>';

    html+=extraSections(d);

    html+='<div id="acctPanel"></div>';
    root.innerHTML=html;
    buildNav(d);
    wireNotify();
    loadPurchases();
    loadDupes();
    loadEnforcement();
    loadAppeals();
    loadSubmissions();
    loadAccounts();
    var g=d.generated_at?new Date(d.generated_at):null;
    stamp.textContent = g ? ('Updated '+g.toLocaleString()) : '';
  }

  function load(){
    btn.setAttribute('disabled','');
    sb.auth.getSession().then(function(s){
      if(!s.data.session){
        msg('<h2>Not signed in</h2>Open the <a href="./">BullQuest app</a> and sign in first, then come back here.');
        btn.removeAttribute('disabled'); return;
      }
      // The stored access token may have expired since the last visit; refresh it before the admin RPC
      // so a stale token never surfaces as "JWT expired".
      return sb.auth.refreshSession().then(function(rs){
        if((rs&&rs.error) || !(rs&&rs.data&&rs.data.session)){
          msg('<h2>Session expired</h2>Open the <a href="./">BullQuest app</a>, make sure you are still signed in, then come back and hit Refresh.');
          btn.removeAttribute('disabled'); return;
        }
        return sb.rpc('admin_analytics').then(function(r){
          btn.removeAttribute('disabled');
          if(r.error){ msg('<h2>Something went wrong</h2>'+esc(r.error.message||'RPC error')); return; }
          var d=r.data;
          if(!d || d.error){ msg('<h2>Not authorized</h2>This account isn\'t an admin. Sign in with the founder account.'); return; }
          render(d);
        });
      });
    }).catch(function(e){ btn.removeAttribute('disabled'); msg('<h2>Error</h2>'+esc((e&&e.message)||e)); });
  }

  function ready(){
    if(!(window.supabase&&window.supabase.createClient)) return setTimeout(ready,60);
    sb=window.supabase.createClient(URL_,KEY_);
    btn.addEventListener('click',load);
    load();
  }
  ready();
})();
</script>
</body>
</html>
