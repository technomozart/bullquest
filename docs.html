var DOC = {"nav":[{"group":"Welcome","items":[{"slug":"README","title":"📖  About BullQuest"},{"slug":"getting-started","title":"🚀  Getting Started"},{"slug":"wallets","title":"🔑  Wallets & Sign-in"}]},{"group":"Your Bulls","items":[{"slug":"bulls","title":"🐂  Beta Bulls and Genesis Bulls"},{"slug":"stats-rarity","title":"📊  Stats, Rarity & Rank"},{"slug":"leveling","title":"📈  Leveling & Progression"}]},{"group":"Playing","items":[{"slug":"arena","title":"⚔️  The Arena (Duels)"},{"slug":"energy","title":"⚡  Energy"},{"slug":"daily-quests","title":"✅  Daily Quests"},{"slug":"daily-spin","title":"🎡  Daily Spin"}]},{"group":"Meta Game","items":[{"slug":"sector-wars","title":"🗺️  Sector Wars"}]},{"group":"Economy","items":[{"slug":"airdrop","title":"📈  Weekly Stock Pot"},{"slug":"currencies","title":"💰  Currencies: GRIT, HAY, $BULL"},{"slug":"tokenomics","title":"🪙  $BULL Tokenomics"},{"slug":"marketplace","title":"🛒  Marketplace"}]},{"group":"More","items":[{"slug":"fairness","title":"⚖️  Fairness & Anti-Cheat"},{"slug":"roadmap","title":"🧭  Roadmap"},{"slug":"faq","title":"❓  FAQ"},{"slug":"not-built-yet","title":"🧭  Not built yet"}]},{"group":"Legal","items":[{"slug":"terms","title":"📜  Terms of Use"},{"slug":"privacy","title":"🔒  Privacy Policy"}]}],"pages":{"README":{"title":"About BullQuest","md":"# About BullQuest\n\nBullQuest is a free-to-play, skill-and-stats bull game. You claim your own free bull, train it up\nthrough quests and duels, and head into the Arena to gather GRIT and climb the board. It is web-first,\nplays in your browser, and every match is resolved on our server, so nobody can hack the outcome.\n\nIf you have played a creature-collector or move-to-earn game, the shape will feel familiar: a collectible\nbull with stats and rarity, an arena where you battle, daily rewards, and a layered currency system.\nBullQuest takes those ideas and fixes the parts that broke them, most importantly the economy (see\n[Currencies](currencies.md) and [$BULL Tokenomics](tokenomics.md)).\n\n## The three pillars\n\n* **Bull Ownership.** Each bull is uniquely yours, with its own rarity, stats, and history, tied to your\n  account from day one. See [Beta Bulls and Genesis Bulls](bulls.md).\n* **Arena Duels.** Fast head-to-head battles decided by your bull's stats, your discipline and stance\n  choices, your bull's rarity and level, and a bounded dose of luck. See [The Arena](arena.md).\n* **Sector Wars** *(live).* Back one of eight crypto-market sectors with your bull and duel wins over a 3-day\n  cycle. See [Sector Wars](sector-wars.md).\n\n## What makes BullQuest different\n\n* **No pay-to-win.** Your first bull is free and its rarity is random, so nobody buys their way to a\n  stronger bull today. Rarity gives a modest, bounded edge (see [Stats, Rarity & Rank](stats-rarity.md)),\n  never a runaway advantage, and you can never edit or buy raw stats.\n* **Nothing to lose.** A duel costs energy, never GRIT: win and you gain GRIT, lose and you keep everything you had. Your daily spin always adds GRIT. Loss should\n  never feel like wasted time.\n* **An economy built to last.** GRIT, the currency you grind, is soft and off-chain, so it can never become\n  token sell pressure. And the plan is to pay players in **real tokenized stock**, not in a coin we printed\n  ourselves, which is the trap that sank similar games. See [Currencies](currencies.md).\n\n## What is live today\n\nBullQuest is being built in the open. Live right now: create an account with Google, email, Telegram, or a Solana wallet, claim your\nfree beta bull, real Arena duels against challenger bulls, energy, a real GRIT balance, the daily spin,\ndaily quests, the Gym, Sector Wars, the Marketplace, social quests, referrals, login streaks, and a GRIT leaderboard.\n\nNot live yet: the **$BULL** token, the **2,000 Genesis Bulls** on Robinhood Chain, and the weekly stock pot.\nThose are on the [Roadmap](roadmap.md). Things we have written down as ideas but have **not** built are\nlisted under [Not built yet](not-built-yet.md), so you can always tell the two apart."},"getting-started":{"title":"Getting Started","md":"# Getting Started\n\nGetting into BullQuest takes under a minute, and you walk away with a free beta bull.\n\n## 1. Open the game\n\nGo to the BullQuest web app in any modern browser (desktop or mobile). There is nothing to download.\n\n## 2. Create your account\n\nOn the welcome screen the fastest ways in are free and need no crypto:\n\n* **Continue with Google** (one tap, if you have a Google account).\n* **Continue with Telegram** (one tap from the Telegram app or our bot).\n* **Continue with email** (an email and a password).\n* **Or connect a Solana wallet** (Phantom, Solflare, or Backpack) if you already use one. Optional. See\n  [Wallets & Sign-in](wallets.md).\n\nEither way, your account is created instantly, with no wallet or crypto required.\n\n## 3. Claim your free bull\n\nThe moment your account is created, BullQuest hands you one **free bull**, drawn at random from what is left in the\npool across the current generations. The last unclaimed Gen 1 bulls are still in there. You will see a reveal card with its name, rarity, and rank. That bull is yours, tied\nto your account, with its own stats and history. Show it off from the reveal to earn bonus GRIT with a\nfriend.\n\n> One free bull per account. Owning more bulls later lets you play more and specialize (see\n> [Stats, Rarity & Rank](stats-rarity.md)).\n\n## 4. Your first duel\n\nHead to the **Arena** from the bottom navigation:\n\n1. Pick a **Discipline** (Clash, Chase, or Standoff). This chooses which of your bull's stats decides the\n   fight.\n2. Pick a **Stance** (Charge, Feint, or Brace). You commit it blind against the challenger's hidden stance,\n   so it is a gamble that swings the fight.\n3. Hit **Fight!** to duel (the go button is Fight, not the Charge stance).\n\nYou win or lose based on your stats, your stance gamble, your bull's rarity and level, your hidden Temper\n(crit) stat, and a small dose of luck. A win pays 20 GRIT plus XP. A loss costs you no GRIT at all and still earns a little XP. Each\nduel spends a little Energy, which refills over time. Full details in [The Arena](arena.md).\n\n## 5. Keep earning\n\n* Take your free **Daily Spin** for 10 to 100 GRIT and clear your **Daily Quests**.\n* Train stats in the **Gym**, and back a sector in **Sector Wars**.\n* Join our **Discord and Telegram** and **invite friends** for bonus GRIT (in the Quests page).\n\nGRIT is what you spend at the Gym and stake in Sector Wars, and when the stock market opens it is what\nyou burn for a share of the weekly pot (see the [Weekly Stock Pot](airdrop.md), which is not open yet).\nThat is the loop: claim, train, duel, climb."},"wallets":{"title":"Wallets & Sign-in","md":"# Wallets & Sign-in\n\nBullQuest is moving its on-chain side to **Robinhood Chain**, but **you do not need a wallet to play**.\nGoogle, email, or Telegram sign-in gives you the exact same game and the same free bull.\n\n## Four ways to sign in\n\n### Continue with Google\n\nOne tap with your Google account. Nothing to install, no password to invent. This is the quickest way in.\n\n### Continue with email\n\nSign up with an email and a password. No crypto at all.\n\n### Continue with Telegram\n\nOne tap from the Telegram app or our bot (@BullQuestSol_bot). No password, and it lands on the same account as the web.\n\n### Connect a Solana wallet (optional)\n\nSupported wallets: **Phantom**, **Solflare**, **Backpack**. Clicking a wallet asks you to **sign a message**\n(not a transaction, so it costs nothing and moves no funds), and BullQuest verifies that signature and logs\nyou in. A wallet is optional for playing, but it is what you use to **buy and sell bulls in the Marketplace**.\n\n> BullQuest never asks for your seed phrase or private key, and signing in never sends a transaction or\n> spends SOL. If anything ever asks for your seed phrase, it is not us.\n\n## Do I need SOL?\n\nNot to play, and not to earn GRIT. You only need SOL for on-chain actions: **buying or\nselling bulls in the Marketplace**, and optional paid extras (an extra spin or an energy refill). Signing in\nwith a wallet is always free.\n\n## Wallets and payments on Telegram and the app\n\nTelegram does not allow crypto payments inside its app, and the in-app browser has no wallet, so **connecting a wallet and paying with SOL do not work inside Telegram**. The same applies to the phone app.\n\nPlaying, dueling, quests, the daily spin, and earning GRIT all work everywhere, including Telegram and the app.\n\nTo connect a wallet, buy or sell a bull, or buy a paid extra, **open BullQuest in your phone browser (Chrome or Safari) or on desktop at bullquest.fun**. It is the same account, so your bulls, GRIT, and progress come with you. When you try one of these actions inside Telegram, BullQuest shows a one-tap \"Open in browser\" prompt.\n\n## Are my bulls on-chain?\n\n**No, and your beta bull is not going to be.** Your beta bull lives in your BullQuest account and stays\nthere. It is not becoming an NFT, and nothing is being converted or migrated.\n\nThe on-chain collection is a **separate** set: **2,000 Genesis Bulls on Robinhood Chain**, and they are\n**not minted yet**. See [Beta Bulls and Genesis Bulls](bulls.md).\n\n## Switching or losing access\n\n* **Google or wallet sign-in:** the same Google account or wallet always returns to the same account.\n* **Telegram sign-in:** opening the Mini App or the bot again returns you to the same account.\n* **Email sign-in:** use the same email and password. A password reset flow is on the way.\n"},"bulls":{"title":"Beta Bulls and Genesis Bulls","md":"# Beta Bulls and Genesis Bulls\n\nBulls are the heart of BullQuest. Every player owns at least one, and each is a unique character\nwith its own look, stats, rarity, and record. There are now two separate sets of bulls, and it is\nworth being clear about which is which.\n\n## Two sets, and they are not the same thing\n\n* **Beta bulls** are the in-game bulls you already play with: 5,000 from the founding run on Solana,\n  plus 5,000 more in generation 2. Every player gets one free. They live in your BullQuest account,\n  they stay exactly as they are, and they are **not** becoming NFTs. They exist so the game keeps\n  running the way it runs today.\n* **Genesis Bulls** are a separate on-chain collection: **2,000 NFTs on Robinhood Chain**, and only\n  2,000, ever. They are **not minted yet**. Holding one is what puts you in the weekly stock pot\n  (see [Weekly Stock Pot](airdrop.md)).\n\nNothing you own is being converted, migrated, or taken away. The rest of this page is about beta\nbulls.\n\n## The beta collection\n\nThe founding run is **5,000 beta bulls**, hand-designed and generated as a layered art set. Every\nbull is a unique combination of traits, so no two are alike. Every new account is given one beta\nbull for free, drawn at random from the pool. Once a bull is claimed it is off the table, so the\npool is finite.\n\n## Generations: Gen 1 and Gen 2\n\nThe founding run went to nearly 5,000 players in the first days, so the collection grows in\n**generations**, and the run a bull is from is part of its identity:\n\n* **Gen 1 (bulls 1 to 5000).** The founding run. No more Gen 1 bulls will ever be printed. They\n  carry the highest Arena stake cap (20 GRIT per duel) and the collector status of the original set.\n* **Gen 2 (bulls 5001 to 10000).** New prints of the same 5,000 designs: the same art, the same\n  traits, the same rarity tier inside their own generation, marked with the print numeral **II**\n  after the name. Their Arena stake cap is 15 GRIT per duel, and they cost **25% less** to buy:\n  price tracks the stake cap, so a Gen 2 bull stakes 25% less and costs 25% less.\n\nTwo prints of the same design fight exactly as hard as each other: rarity tilt and stats work the\nsame inside every generation. What the earlier generation keeps is scarcity, stake cap, and\nprestige. A handful of unclaimed Gen 1 bulls remain in the free pool, so a new signup can still get\nlucky. The Market lets you filter by generation, and every bull card shows its Gen mark.\n\n## What a bull is made of\n\nEach bull is built from four visible art layers plus a set of game stats:\n\n* **Body** (hide color): the base color of the bull.\n* **Belly**: the belly patch color.\n* **Horns**: shape and material, from plain nubs to legendary lava, gold, galaxy, and more.\n* **Face**: the expression and muzzle.\n\nColors are coordinated on purpose. A bull's body, belly, and horns share a color temperature (warm\nor cool), with neutral tones that pair with anything, so every bull looks intentional rather than\nrandom.\n\nUnder the hood, a bull also has combat stats (Power, Speed, Stamina, and hidden Temper), a level,\nenergy, and a win/loss record. See [Stats, Rarity & Rank](stats-rarity.md).\n\n## Gen 1 perks\n\nGen 1 beta bulls are the founding run. They carry permanent, **bounded** perks: prestige cosmetics\n(think golden horns and auras on the rarest ones), a small GRIT-gain bonus, and priority access to\nevents.\n\nIn a fight, a Gen 1 bull's only edge comes from its **rarity and level**, a small, bounded tilt to\nits win chance that the Arena shows you before every duel (see\n[Stats, Rarity & Rank](stats-rarity.md)). There is no separate hidden generation multiplier stacked\non top, and you can never buy or edit raw stats, so no bull is ever an auto-win.\n\n## Owning more than one\n\nYou start with one. You can already buy more bulls in the live Marketplace. More bulls means:\n\n* More total **Energy** across your stable, so more duels per day.\n* The ability to **specialize**, for example a Clash bull, a Chase bull, and a Standoff bull.\n* More **Sector Wars** deployments.\n\nMore bulls scale your *breadth of participation*, with deliberately diminishing returns, never your\nraw power. See [Currencies](currencies.md) for why the economy is built this way.\n"},"stats-rarity":{"title":"Stats, Rarity & Rank","md":"# Stats, Rarity & Rank\n\n## The four stats\n\nEvery bull has four stats. Three are visible and drive combat; one is hidden and creates build variety.\n\n| Stat | What it does | Where it matters |\n|---|---|---|\n| **Power** | Raw charge force | Primary stat in the **Clash** discipline |\n| **Speed** | Agility and initiative | Primary stat in the **Chase** discipline |\n| **Stamina** | Endurance and grit | Primary stat in the **Standoff** discipline |\n| **Temper** *(hidden)* | Wildness | Drives the chance and size of a critical \"Rampage\" hit |\n\nYour starter bull begins with modest, slightly varied stats so no two bulls play identically. Winning duels\nearns XP, and every level-up raises Power, Speed, and Stamina.\n\n## Rarity\n\nRarity does three things: it sets a bull's **starting stats and energy pool**, it gives a **small, bounded\nedge to its win chance**, and it carries **prestige**. Higher rarity is an advantage, but a measured one, not\nan auto-win, and because your first bull is free and random, nobody buys a better win rate today.\n\nThe four live rarity tiers (illustrative starting numbers, tuned during testing):\n\n| Rarity | Starting stats | Energy pool | Win-chance edge* |\n|---|---|---|---|\n| **Common** | lower | 10 | baseline (~47%) |\n| **Rare** | higher | 12 | ~49% |\n| **Epic** | higher still | 14 | ~56% |\n| **Legendary** | highest | 16 | ~60% |\n\n*Win chance shown against an evenly matched challenger at level 1; leveling your bull adds a few more points.\nThe Arena shows your live win chance before every duel, so there is no hidden math. These numbers are\nbounded on purpose: a well-played Common still wins plenty, and no bull is ever a guaranteed win.\n\n## Rank\n\nEvery beta bull also has a **collection rank** from 1 to 5,000, where **1 is the rarest**. Rank reflects\nhow unusual a bull's specific trait combination is. When you claim a bull you see its rank\n(\"Rank #864 of 5,000\"). In the app, a bull's rarity tier (Common, Rare, Epic, Legendary) is derived from its\nrank: the lower the rank number, the higher the tier.\n\n## Stats are earned, never bought or hacked\n\nYour stats come from **playing**: winning duels, leveling up, and training in the **Gym** (spend GRIT to raise Power, Speed, or Stamina). They live on the\nserver and cannot be edited from your browser. Nobody can pay to bump their Power, and nobody can hack their\nstats client-side. See [Fairness & Anti-Cheat](fairness.md)."},"leveling":{"title":"Leveling & Progression","md":"# Leveling & Progression\n\nYour bull grows stronger as you play. Leveling raises its stats toward its rarity ceiling, so a bull\nyou invest in becomes a real contender.\n\n## How you level\n\n* Winning and fighting duels earns **XP**.\n* When your XP bar fills, your bull **levels up**, and its Power, Speed, and Stamina each rise a\n  little.\n* Levels run from 1 upward, with each level needing more than the last, so late levels are a real\n  goal to chase.\n\n## The GRIT curve (design)\n\nIn the full design, leveling is paced by a rising **GRIT** cost curve: you fill each level bar with\nGRIT earned from play. Early levels are cheap; later ones cost a lot more. This makes GRIT a\nmeaningful sink and makes a single free bull take a while to max, which is exactly the intended\npace. Today, XP from duels drives leveling directly; the GRIT-paced curve arrives as progression\ndeepens.\n\n## Milestone gates (coming)\n\nEvery few levels there is a **milestone gate** that costs a hard resource:\n\n* **Before the token:** the gate costs **HAY** (bought with SOL or card).\n* **After the token launches:** the gate adds a small **$BULL** burn.\n\nThis keeps the game fully playable before the token exists, then switches on a clean token sink\nlater without changing how the game feels.\n\n## Ceilings, not power creep\n\nA bull levels up and grows stronger as it wins. That keeps the game fair: leveling\nis meaningful, but it cannot push any bull past the fair bounds of its bracket. See\n[Stats, Rarity & Rank](stats-rarity.md).\n\n## Owning more bulls\n\nProgression is per bull. Owning more bulls lets you level several in parallel and specialize each\nfor a discipline, which is breadth, not a shortcut to raw power.\n"},"arena":{"title":"The Arena (Duels)","md":"# The Arena (Duels)\n\nThe Arena is where BullQuest is won and lost. A duel is a fast, one-on-one battle decided by your bull's\nstats, the discipline and stance you choose, your bull's rarity and level, and a small, bounded dose of luck.\nEvery part of the result is calculated on the server, so it cannot be tampered with from your browser.\n\n## The flow of a duel\n\n1. You are matched against a **challenger** bull whose stats mirror your own, so the fight is close (a real\n   skill-based matchmaking system against other live players is on the [Roadmap](roadmap.md); today the\n   challenger is generated to be a fair, near-even opponent).\n2. You choose a **Discipline** and a **Stance**.\n3. You hit **Fight!**.\n4. The server resolves the duel, shows you the result, and pays out.\n\n## Disciplines (the stat matchup)\n\nYour Discipline decides which stat carries the fight. Each weights the three visible stats differently:\n\n| Discipline | Primary (60%) | Second (25%) | Third (15%) |\n|---|---|---|---|\n| **Clash** (head-on) | Power | Stamina | Speed |\n| **Chase** (pursuit) | Speed | Power | Stamina |\n| **Standoff** (endurance) | Stamina | Speed | Power |\n\nPick the discipline that plays to your bull's strengths. A high-Power bull wants Clash; a fast bull wants\nChase.\n\n## Stances (the blind gamble)\n\nBefore the duel you secretly pick a **Stance**. Stances beat each other in a rock-paper-scissors:\n\n```\nCHARGE  beats  FEINT  beats  BRACE  beats  CHARGE\n(reckless)     (trickery)    (dig in)\n```\n\nYou commit **blind** against the challenger's hidden stance, so this is a gamble, not a read: you cannot see\nwhat they will pick.\n\n* Win the guess and you get a **boost** to your score.\n* Mirror (same stance) is neutral.\n* Lose the guess and you take a small penalty.\n\nOver many duels the stance gamble evens out, but in any single fight it can swing the result, which keeps\nevery duel tense.\n\n## How a duel is scored\n\nEach side's score is calculated as:\n\n```\nScore = WeightedStats  x  StanceResult  x  Crit  x  Luck  x  RarityAndLevelEdge\n```\n\n* **WeightedStats**: your stats weighted by the chosen discipline.\n* **StanceResult**: boost, neutral, or penalty from the stance gamble.\n* **Crit**: a chance for a critical \"Rampage\" hit, driven by your hidden **Temper** stat. When it lands it\n  adds a bonus.\n* **Luck**: a small, bounded random factor, generated on the server (see\n  [Fairness & Anti-Cheat](fairness.md)).\n* **RarityAndLevelEdge**: a modest tilt from your bull's rarity and level (see\n  [Stats, Rarity & Rank](stats-rarity.md)).\n\nThe higher score wins. Because the challenger mirrors your power and the random factor is bounded, fights are\nclose and the stronger, better-played bull wins more often, not always.\n\n## Rewards\n\n* **Win**: you earn 20 GRIT plus a chunk of XP.\n* **Loss**: you keep all your GRIT and still earn a little XP. The only thing a duel spends is energy.\n\nThe Arena shows exactly what you win and what you risk before you charge. (Redistributive prize pools, where\nwinnings come from other players' entry fees, arrive with the token phase; see [Currencies](currencies.md).)\n\n## Cost\n\nEach duel spends **2 Energy**, which refills over time, and you can buy a pass that refills it faster. See [Energy](energy.md). Ranked and\ntournament entries will use HAY once it ships.\n\n## Bear Raids (coming)\n\nAlongside duels, **Bear Raids** are co-op or solo battles against Bear-Market bosses, good for new and solo\nplayers. Planned for a later phase."},"energy":{"title":"Energy","md":"# Energy\n\nEnergy is how many duels your bull can fight before it needs to rest. It is the natural pace-setter of the\ngame and the reason to come back through the day.\n\n## How it works\n\n* Each bull has an **Energy pool** that scales with rarity: **10** for Common up to **16** for Legendary.\n* A duel costs **2 Energy**.\n* Energy **regenerates over time**, currently 1 point roughly every 15 minutes, up to your pool cap.\n  (Numbers are tuned during testing.)\n\nSo a full bull can fight several duels in a row, then tops back up on its own while you are away. Unspent\nregeneration is a gentle nudge to return.\n\n## Energy and rarity\n\nHigher-rarity bulls have **larger energy pools**, so they can play more per day. This is part of what rarity\nbuys: more plays per day (throughput). See [Stats, Rarity & Rank](stats-rarity.md).\n\n## Refills and passes (live)\n\nTwo ways to spend less time waiting. Both are optional, and both are web only.\n\n* **Instant refill, 0.005 SOL.** Fills your active bull straight back to full. The price steps up a little the more refills you buy in the same day.\n* **Energy pass.** Regenerates energy **3x faster** for a fixed window: **Day pass 0.02 SOL** (24 hours) or **Week pass 0.15 SOL** (7 days). While a pass is running a point comes back every **5 minutes** instead of 15. Buying another pass extends your window rather than stacking the speed.\n\nA pass does **not** raise your energy maximum, and neither option changes your odds of winning a duel. They buy the chance to play more often, never a better result. See [Currencies](currencies.md).\n\n## Multiple bulls, more energy\n\nBecause energy is per bull, owning more bulls means more total energy across your stable, and more duels per\nday. This is the main way owning more bulls scales your play, always breadth, never raw power."},"daily-quests":{"title":"Daily Quests","md":"# Daily Quests\n\nDaily Quests are small goals that reset each day and reward you for playing the way the game is meant to be played.\n\n## The daily set\n\nThree quests reset every day. Do the action, then claim the reward on the Home screen:\n\n| Quest | What you do | Reward |\n|---|---|---|\n| **Spin the wheel** | Take your free Daily Spin | **25 GRIT** |\n| **Fight 3 duels** | Enter the Arena and fight three times | **40 GRIT** |\n| **Win a duel** | Win at least one duel | **50 GRIT** |\n\nThat is **115 GRIT a day** on top of what the duels and the spin pay you by themselves.\n\n## Daily login streak\n\nSimply opening the game pays you, and it grows the longer you keep the run alive:\n\n* **15 GRIT** on your first day, and **5 more** for each day you come back.\n* The daily amount stops growing at **70 GRIT**.\n* A **100 GRIT** bonus every 7 days, and a **400 GRIT** bonus at 30 days.\n* Miss a day and the streak starts over.\n\n## Community quests (one time each)\n\nThese live on the in-app **Quests** page and pay once:\n\n| Quest | Reward |\n|---|---|\n| Join our **Discord** | 100 GRIT |\n| Join our **Telegram** | 100 GRIT |\n| React to our announcement in Discord | 40 GRIT |\n| Follow **@BullQuestSol** on X | 25 GRIT |\n| Repost our launch post on X | 25 GRIT |\n| Reply to our launch post on X | 20 GRIT |\n| Boost our Telegram launch thread | 20 GRIT |\n| **Post about BullQuest on X** | **150 GRIT** |\n\nThe 150 GRIT one is the biggest single reward in the game. Post on X saying why you like BullQuest, tag 3 friends, include **#BullQuest #RobinhoodChain**, tag **@BullQuestSol**, then paste your tweet link into the quest.\n\n**Referrals** pay **200 GRIT** for every friend who joins, reaches level 2, and plays on two separate days. Your friend gets **50 GRIT** too.\n\nAll of it builds your GRIT balance, which is what you spend, stake, and later burn. See\n[Currencies](currencies.md)."},"daily-spin":{"title":"Daily Spin","md":"# Daily Spin\n\nThe Daily Spin is your free once-a-day pull on the prize wheel. It is the easiest GRIT you will earn\nand a good reason to check in every day.\n\n## How it works\n\n* Every account gets **one free spin per day**.\n* The wheel has 12 segments, all **GRIT** rewards, from small to a rare **100 GRIT jackpot**.\n* The result is decided on the server, then the wheel lands on it, so what you see is what you get.\n* The reward is credited to your GRIT balance immediately.\n* After you spin, the card shows \"Come back tomorrow\" until your next free spin unlocks.\n\n## Odds\n\nSmaller GRIT prizes are common; the 100 GRIT jackpot is deliberately rare. You are guaranteed to win\nGRIT on every spin, there are no empty slots.\n\n## Extra spins (live)\n\nPast your free daily spin you can buy an **extra spin for 0.001 SOL**. The price steps up a little the more you buy in the same day, so it stays a treat rather than a farm.\n\nEvery extra spin pays GRIT like any other, and it also carries a **very small chance of winning a bull outright**, free, added to your stable on the spot. The odds are deliberately tiny, so treat it as a lottery ticket on top of the GRIT rather than a way to collect bulls.\n\nHAY may replace SOL for extra spins later.\n"},"sector-wars":{"title":"Sector Wars","md":"# Sector Wars\n\nSector Wars is BullQuest's competitive faction game, and it is **live**. Back one of eight crypto-market\nsectors with your bull, win duels for it, and if your sector wins the cycle you split the pooled GRIT with\nthe other top backers.\n\n## The 3-day cycle\n\n1. **Back a sector.** Stake GRIT on one of the eight sectors (DeFi, Memes, L1s, Gaming, AI, RWA, NFTs,\n   Privacy) with your active bull. You can back only one sector per cycle.\n2. **Fight for it.** Win Arena duels while backing a sector to raise its contribution. Wins count for far\n   more than losses, and a bigger stake gives only a small, sub-linear boost, so skill leads.\n3. **Resolve.** Every 3 days the sector with the most total contribution wins.\n4. **Split the pool.** The winning sector's top backers split the pooled GRIT from every sector, minus a\n   15% burn. You must have won at least one duel while backing to be eligible.\n\n## Fair by design\n\n* **Skill first:** contribution comes mostly from duel **wins**, not from how much GRIT you stake.\n* **Anti-sybil enlist gate:** you need enough earned GRIT, a minimum level, and some account age to join.\n* **Caps and refunds:** duels that count are capped per day and per cycle, a single backer's share is\n  capped in large fields, and if too few real backers join, everyone is refunded.\n* **Emission-safe sink:** payouts only ever redistribute staked GRIT, never printed GRIT, and the 15% burn\n  makes every cycle a net GRIT sink.\n\nWinning also earns a Warlord / Sector Champion badge. See [Currencies](currencies.md).\n\n> Sector Wars is played solo: you back a sector as an individual. Playing it as a team is an idea we have\n> written down, not a built feature, see [Not built yet](not-built-yet.md)."},"currencies":{"title":"Currencies: GRIT, HAY, $BULL","md":"# Currencies: GRIT, HAY, $BULL\n\nBullQuest uses three currencies, deliberately separated so each does one job well. This separation is the\ncore fix for the economy problems that sank move-to-earn tokens.\n\n## The one principle\n\n> The tradeable token's demand must not come from expecting to earn more of the token.\n\nThe game currency you grind (GRIT) is soft and off-chain, so grinding it can never become token sell\npressure. And player rewards are paid in **real tokenized stock**, not in $BULL, so paying players never\nmeans printing more of the token. That single choice is why the economy is built to last.\n\n## GRIT (soft currency, live)\n\n* **What:** an off-chain, in-game currency. Never tradable, never cashable, no monetary value. You start\n  with a small balance.\n* **Earn it from:** duels, the Daily Spin, Daily Quests,\n  **Sector Wars** wins, **social quests** (Discord/Telegram/X), and **referrals**.\n* **Spend it on (live):** the **Gym** (train Power, Speed, Stamina) and staking to **back a sector** in\n  Sector Wars. More GRIT sinks arrive as systems ship.\n* **Why it matters:** when the stock market opens, GRIT is what you **burn on a stock** to claim a share\n  of that week's pot. See the [Weekly Stock Pot](airdrop.md). It is not open yet.\n\n## HAY (premium consumable, coming)\n\n* **What:** a consumable \"gas\" bought with $BULL, SOL, or a card.\n* **Spend it on:** energy refills, arena and tournament entry fees, temporary boosts, and extra spins.\n* **Why:** HAY is **burned on use**, which creates a steady, low-friction sink.\n\n## $BULL (the token, not live)\n\n* **What:** an **ERC-20 token on Robinhood Chain**, an Arbitrum Orbit L2 with chain ID **4663**, where gas\n  is paid in **ETH**. Hard-capped supply. It is **not live**.\n* **Demand comes from (non-reflexive):** utility (high-stakes entries, premium cosmetics), status (holding\n  tiers, exclusive events, governance), and **buyback-burn from real revenue**.\n* **How you would get it:** on the **open market** when it launches. There is **no airdrop, no presale and\n  no private round**. Player rewards are paid in real tokenized stock, not in $BULL.\n\nSee [$BULL Tokenomics](tokenomics.md) and the [Weekly Stock Pot](airdrop.md).\n\n> The $BULL token is planned and forward-looking. It may change, be delayed, or never launch, and nothing\n> here is a promise of value or a financial return. See the [Roadmap](roadmap.md) and [Terms](terms.md)."},"tokenomics":{"title":"$BULL Tokenomics","md":"# $BULL Tokenomics\n\n> The token is **not live**. It is being relaunched on **Robinhood Chain**, and the date is **to be\n> announced**. Everything below is the current plan, published as it stands rather than after the fact.\n\n## Headline\n\n* **Token:** $BULL, an ERC-20 on **Robinhood Chain** (an Arbitrum Orbit Layer 2, chain ID 4663).\n* **Gas:** ETH. Robinhood Chain has no token of its own.\n* **Supply:** hard-capped. The final figure is published at or before launch.\n* **Distribution:** open market only. **No airdrop, no presale, no private round.**\n* **Disclosure:** the full allocation and vesting schedule is published at or before launch.\n\n## Where rewards come from\n\nPlayer rewards come from **real tokenized stock**, bought with trading fees, not from a carved-out\nsupply bucket. See the [Weekly Stock Pot](airdrop.md). Holding one of the 2,000 Genesis Bulls is what\nputs you in the pot.\n\n## Why we moved chains\n\nThe first launch was on Solana and it did not hold. We are not going to pretend otherwise, and we are\nnot going to pretend that changing chains fixes demand by itself, because it does not. Cheap gas is\ntrue of thirty chains and explains nothing.\n\nWhat Robinhood Chain has that no other chain has is **real tokenized stock living on it as ordinary\non-chain tokens**. That means we can pay players in **NVDA, TSLA, AAPL, AMZN and SPY** instead of in a\ncoin we printed ourselves. The reward is worth something whether or not anybody believes in BullQuest,\nand that is the entire reason we are here.\n\n## What has not changed\n\n* **No presale and no private round.**\n* **No big locked insider reserve.**\n* The game stays **free to play**, with no wallet needed to start.\n\n## Not affiliated with Robinhood\n\nBullQuest is built **on** Robinhood Chain, which is a public, permissionless network that anyone can\ndeploy to. BullQuest is not affiliated with, endorsed by, or connected to Robinhood Markets, Inc.\n"},"marketplace":{"title":"Marketplace","md":"# Marketplace\n\nThe Marketplace is **live**. You can buy and sell bulls for real **SOL**, right in the Market tab.\n\n## Buying a bull\n\n* Every account starts with one free beta bull. To get more, open the **Market** and buy an available\n  bull. Price is set by rarity (roughly Common 0.05, Rare 0.25, Epic 0.60, Legendary 2.0 SOL).\n* You can also buy a bull another player has listed for resale.\n* Owning more bulls lets you play more and specialize. You pick one **active** bull for the Arena.\n\n## Selling your bull\n\n* List any bull you own (except your free starter bull) for a price in SOL.\n* When it sells you receive **85%**, with a **15% platform fee**. Payment is a single on-chain Solana\n  transaction that pays you and the treasury at the same time, so no one holds your funds in between.\n\n## Safe by design\n\n* Trades settle on Solana and are verified on-chain before ownership changes hands.\n* Settlement runs through locked, server-only routines, and there is no hot treasury key on any server.\n* Your free starter bull is non-sellable, and only available (unowned) bulls show as buyable.\n\n> Beta bulls live in your BullQuest account and are not becoming NFTs. The on-chain collection is a\n> separate set of 2,000 Genesis Bulls on Robinhood Chain, and they are not minted yet. See\n> [Beta Bulls and Genesis Bulls](bulls.md).\n\n## Where buying and selling happen\n\nBuying and selling bulls moves SOL, so it needs a connected wallet. **That happens in your web browser (Chrome, Safari, or desktop at bullquest.fun), not inside Telegram or the phone app**, because Telegram does not allow crypto payments in-app. It is the same account either way. See **Wallets & Sign-in** for details.\n"},"fairness":{"title":"Fairness & Anti-Cheat","md":"# Fairness & Anti-Cheat\n\nBullQuest is built so that nobody can cheat the outcome of a duel or their stats.\n\n## Server-authoritative outcomes\n\nEvery duel is resolved **on the server**, inside a database function. Your browser sends your choices\n(discipline, stance, stake); it does not send the result. This means:\n\n* You cannot edit your stats from the browser. Power, Speed, Stamina, level, XP, and your record are all\n  server-side and locked, so there is no way to hack a stronger bull.\n* You cannot forge a win. The math runs where you cannot touch it.\n\n## Randomness you cannot rig\n\nThe bounded random factor in a duel is generated **on the server** from a seed you cannot predict or control\n(it mixes server-side randomness with the exact moment of the request). Because the roll happens where you\ncannot reach it, you cannot force a favorable result from your browser.\n\n> **Coming:** full public commit-reveal verification, where the server publishes a hashed seed before the\n> duel and reveals it after so anyone can recompute and check the result. Today randomness is\n> server-controlled and tamper-resistant; the public-verification layer is a planned upgrade.\n\n## Close, fair fights\n\nToday every challenger is generated to **mirror your bull's power**, so fights are close and decided by your\ndiscipline, your stance gamble, your bull's rarity and level, and bounded luck, not by a lopsided matchup.\nFull skill-based matchmaking against other live players, with a Bull Rating system, is on the\n[Roadmap](roadmap.md).\n\n## No pay-to-win, little to bot\n\n* Your first bull is free and random, and you can never buy or edit raw stats, so there is no way to\n  purchase a win.\n* GRIT is a soft, off-chain currency with no cash value, and outcomes are server-side, so there is little to\n  gain from botting today. As the marketplace and token arrive, rate limits and anti-abuse measures scale up\n  with them.\n\n## Your account safety\n\nBullQuest never asks for your seed phrase or private key. Signing in with a wallet is a message signature,\nnot a transaction: it costs nothing and moves no funds. If anything ever asks for your seed phrase, it is\nnot us."},"roadmap":{"title":"Roadmap","md":"# Roadmap\n\nThe game first, ownership and the token after. Here is where things really stand.\n\n## Live now\n\n* **Play:** create an account (Google, email, Telegram, or a wallet), claim your bull, and duel in the\n  Arena. Energy, GRIT, the Daily Spin, Daily Quests, streaks, and the **Gym**.\n* **Sector Wars v1:** back one of eight crypto-market sectors, win duels for it, and split the pooled\n  GRIT if it wins the 3-day cycle.\n* **Marketplace:** buy and sell bulls for real SOL.\n* **Social quests and referrals.**\n* **Leaderboard:** ranked by all the GRIT you have ever earned. It decides who earns a Genesis Bull.\n\n## Next\n\n* **Genesis Bulls:** 2,000 minted as real NFTs on Robinhood Chain. The **top 200** on the leaderboard\n  earn one. The rest go to the open market. Date **to be announced**.\n* **$BULL token** on Robinhood Chain. Date **to be announced**.\n* **Weekly stock pot:** 70% of trading fees buy real tokenized stock (NVDA, TSLA, AAPL, AMZN, SPY) into a\n  weekly pot that GRIT burns share out. See the [Weekly Stock Pot](airdrop.md). Not open yet.\n\n## Later\n\n* Tournaments and seasons, a ranked ladder with brackets and prize pools.\n* Everything else we have written down but not committed to or built is listed under\n  [Not built yet](not-built-yet.md).\n\nNo dates are promised on the items above. When one is fixed, it is published here first.\n"},"faq":{"title":"FAQ","md":"# FAQ\n\n### Is BullQuest free?\n\nYes. You create an account and get a free beta bull, and the whole game loop (duels, spin, quests) is free\nto play. You never have to spend to compete.\n\n### Do I need a crypto wallet?\n\nNo. You can sign up with Google, email, or Telegram, all free. Connecting a Solana wallet (Phantom, Solflare, Backpack) is an\noptional, smoother way to sign in, and it will be needed later for on-chain features. See\n[Wallets & Sign-in](wallets.md).\n\n### Can I sign in with Google?\n\nYes. **Continue with Google** is the fastest one-tap way in, alongside email. A wallet is optional. See [Wallets & Sign-in](wallets.md).\n\n### How do the weekly stock rewards work?\n\n**70% of trading fees** are used to buy real tokenized stock, **NVDA, TSLA, AAPL, AMZN and SPY**, into a\n**weekly pot**. Hold a **Genesis Bull**, burn GRIT on a stock during the week, and the pot is split in\nproportion to how much GRIT you burned, with a cap per wallet. **The market is not open yet.** See the\n[Weekly Stock Pot](airdrop.md).\n\n### Do I need SOL to play?\n\nNo. Signing in with a wallet is a free message signature, not a\ntransaction. You only need SOL to **buy or sell bulls in the live Marketplace** or for optional paid extras\n(an extra spin, an energy refill).\n\n### Is my bull an NFT on-chain?\n\nNo, and your beta bull is not going to be. It lives in your BullQuest account and stays there. The\non-chain collection is a separate set of **2,000 Genesis Bulls on Robinhood Chain**, and they are **not\nminted yet**. See [Beta Bulls and Genesis Bulls](bulls.md).\n\n### Can I earn real money right now?\n\nNo, and that is by design. Today you earn GRIT, a soft in-game currency that is not tradable or cashable.\nThe weekly stock pot, where GRIT burns pay out in real tokenized stock, is **not open yet**, and it will\nneed a Genesis Bull.\n\n### Does rarity or spending let me win more?\n\nRarity gives a **small, bounded edge** to your win chance, and higher-rarity bulls have bigger energy pools,\nso they can play more. But your first bull is free and random, you can never buy or edit raw stats, and the\nArena shows your exact win chance before every duel. So higher rarity helps a little; it is never an auto-win\nand nobody buys their way to a better win rate. See [Stats, Rarity & Rank](stats-rarity.md).\n\n### Why did my duel lose when I guessed the stance right?\n\nWinning the stance gamble tips the fight in your favor; it does not guarantee a win. Your stats, the\nchallenger's stats, the crit rolls, rarity and level, and bounded luck all factor in. That variance is what\nkeeps the Arena tense. See [The Arena](arena.md).\n\n### How does energy work?\n\nEach duel costs 2 energy, and energy refills about 1 point every 15 minutes. Higher-rarity bulls have bigger\nenergy pools (10 for Common up to 16 for Legendary). See [Energy](energy.md).\n\n### My bull shows a placeholder image, not real art. Why?\n\nThe 5,000-bull art set is being uploaded in batches. If your bull shows a placeholder, its image is still on\nits way and will appear shortly.\n\n### How do I get support?\n\nUse the in-app **Feedback** button or the **Bull Assistant** chat any time. Full support channels open\nalongside the public launch.\n\n> Brand, numbers, and exact rules in these docs are provisional and tuned during testing."},"terms":{"title":"Terms of Use","md":"# Terms of Use\n\n_Last updated: July 2026. BullQuest is in active development (beta); these terms are a starting point and will be updated before public launch._\n\nWelcome to BullQuest (\"BullQuest\", \"we\", \"us\"). By creating an account or playing, you agree to these Terms of Use. If you do not agree, please do not use BullQuest.\n\n## 1. Who can play\n\nYou must be at least 13 years old (or the minimum digital-consent age where you live) and able to form a binding agreement. Do not use BullQuest where it is prohibited by law.\n\n## 2. Your account\n\n- You are responsible for keeping your login (email and password, or your Solana wallet) secure.\n- One account per person. Do not create multiple accounts to farm rewards.\n- We never ask for your wallet seed phrase or private keys, and we never take custody of your funds. Signing in with a wallet is a message signature, not a transaction.\n\n## 3. The game and GRIT\n\nBullQuest is a free-to-play game. **GRIT is a soft, in-game currency with no monetary value.** It is not money, is not redeemable for cash, and cannot be sold, traded, or transferred off the platform. Your bull, stats, GRIT, and other in-game items are a limited license to use inside the game, not property or a financial instrument, and we may adjust them as part of running and balancing the game.\n\n## 4. Forward-looking features and the $BULL token\n\nParts of BullQuest describe planned features, including the **$BULL token**, the **Genesis Bull NFTs**, and the **weekly stock pot**. These are **forward-looking and are not a promise or guarantee.** They may change, be delayed, or never launch. Nothing in BullQuest is an offer or solicitation to buy any token or security, is financial or investment advice, or is a guarantee of any future value or reward. Do not play expecting financial gain. Any future token, on-chain collection, or reward pot, if it happens, will have its own separate terms.\n\n## 5. Fair play\n\nDo not cheat, exploit bugs, use bots or automation, reverse-engineer, tamper with game data, or otherwise gain an unfair advantage. We may suspend or terminate accounts that break these rules or abuse the service, and we may remove rewards obtained unfairly.\n\n## 6. Availability\n\nBullQuest is provided \"as is\" and \"as available\", without warranties of any kind. We may change, suspend, or discontinue any part of the game at any time, and we do not guarantee uninterrupted or error-free operation.\n\n## 7. Limitation of liability\n\nTo the maximum extent permitted by law, BullQuest and its team are not liable for any indirect, incidental, or consequential damages, or for any loss of data, in-game items, GRIT, or anticipated rewards, arising from your use of the game.\n\n## 8. Changes\n\nWe may update these terms as the game evolves. Material changes will be shown here with a new date. Continuing to play after an update means you accept the updated terms.\n\n## 9. Contact\n\nQuestions? Reach us through the in-app **Feedback** button or the official BullQuest channels.\n"},"privacy":{"title":"Privacy Policy","md":"# Privacy Policy\n\n_Last updated: July 2026. BullQuest is in active development; this policy will be updated before public launch._\n\nThis policy explains what BullQuest collects and how we use it. We collect only what we need to run the game.\n\n## What we collect\n\n- **Account:** if you sign up with email, your email address and a password (stored hashed, never in plain text). If you sign in with a Solana wallet, your **public wallet address** (never your seed phrase or private keys).\n- **Gameplay:** your bull, its stats and record, your GRIT balance, and your duels, quests, and spins.\n- **Feedback:** anything you send through the in-app Feedback tool, including an optional screenshot you choose to attach.\n- **Technical:** basic technical data (such as IP address and device or browser info) processed by our infrastructure providers to deliver and secure the service.\n\n## How we use it\n\nTo create and run your account, provide the game, save your progress, prevent cheating and abuse, respond to feedback and support, and improve BullQuest. We do **not** sell your personal data.\n\n## Who processes it\n\nBullQuest runs on third-party infrastructure that processes data on our behalf, including **Supabase** (database, authentication, and file storage), **Cloudflare** (bot and abuse protection), and **GitHub Pages** (web hosting). Each has its own security and privacy practices.\n\n## Local storage\n\nWe store small amounts of data in your browser, such as your login session and preferences like your login streak and whether you have seen the intro guide. You can clear this from your browser at any time.\n\n## Wallet and blockchain\n\nA Solana wallet address is public on the blockchain by nature. We use it only to identify your account. We never receive or store your seed phrase or private keys, and signing in never moves funds.\n\n## Keeping and deleting data\n\nWe keep your data while your account is active. You can request access to or deletion of your data through the in-app Feedback button or the official BullQuest channels. Deleting your account releases your bull back into the collection.\n\n## Children\n\nBullQuest is not directed at children under 13 (or the minimum age where you live). We do not knowingly collect their data.\n\n## Changes\n\nWe may update this policy as the game evolves; material changes will be shown here with a new date.\n\n## Contact\n\nReach us through the in-app **Feedback** button or the official BullQuest channels.\n"},"airdrop":{"title":"Weekly Stock Pot","md":"# Weekly Stock Pot\n\nRewards do not come from a slice of token supply. They come from **real tokenized stock**, bought with\ntrading fees and paid out to the players who actually play.\n\n## How it works\n\n* **70% of trading fees** are used to buy real tokenized stock: **NVDA, TSLA, AAPL, AMZN and SPY**.\n* That stock funds a **weekly pot**.\n* During the week you **burn GRIT on a stock** you choose.\n* At the end of the week the pot is split **in proportion to how much GRIT you burned**, with a cap per\n  wallet so one wallet cannot take the whole pot.\n* **You must hold a Genesis Bull to take part.** Only 2,000 will exist. Without one you can still play the\n  whole game, you are just not in the payout.\n\n**The market is not open yet.** Nothing has been paid out, and no burn is possible until it opens.\n\n## Why stock instead of a token\n\nPaying rewards in a coin we printed ourselves means the reward is only ever worth what that coin is worth\non the day, and every payout adds sell pressure to the thing it is paying you in. Every play-to-earn\neconomy has died that way.\n\nReal tokenized stock is different. NVDA is worth what NVDA is worth. It does not need anybody to believe\nin BullQuest to have value, and paying it out does not inflate anything.\n\n## Honest limits\n\n* **If nothing trades, the pot is small.** This is a share of real activity, not a promise of a number.\n  We would rather tell you that now than dress it up.\n* **Pot size varies week to week.** It depends entirely on trading volume in that window.\n* Exact figures and the opening date are **to be announced**.\n\n## What replaced what\n\nThe previous plan committed 10% of token supply across 10 fixed rounds. **That plan is retired.** Nothing\nwas ever paid out under it, so no one is worse off than they were.\n"},"not-built-yet":{"title":"Not built yet","md":"# Not built yet\n\nEverything else in these docs describes the game as it works right now. This page is the opposite: a\nshort, honest list of things that have been written down as ideas and **have not been built**. None of\nthem exist today, and none of them are commitments.\n\n* **Idle training sessions.** Start a session on a bull, walk away, come back and collect. This is not\n  the Gym, which is live and where you spend GRIT to raise a stat.\n* **Breeding and fusion.** Pairing two bulls to produce an offspring, or burning several bulls to make\n  one rarer bull.\n* **Gear.** Horns, rings, brands, armor, and boots you equip on a bull.\n* **Clans.** Groups that back a sector together and split the rewards as a team. Sector Wars is live,\n  but it is played solo.\n* **An account level rank.** An account-wide rank separate from your bull's rarity and level.\n* **A seasonal ranked ladder.** Tiers, promotions, relegations, and season resets on top of duels.\n  Duels, GRIT rewards, your win/loss record, and the GRIT leaderboard are all live today. The ladder\n  is not.\n\nWhen one of these is actually built, it gets its own page here with the real numbers in it. Until then\nthere is nothing to document, because there is nothing to describe.\n"}},"first":"README"};
var flat = [];
DOC.nav.forEach(function(g){ g.items.forEach(function(i){ flat.push(i); }); });

function buildNav(filter){
  var list = document.getElementById('navlist'), html = '';
  DOC.nav.forEach(function(g){
    var items = g.items.filter(function(i){ return !filter || i.title.toLowerCase().indexOf(filter.toLowerCase())>=0; });
    if(!items.length) return;
    html += '<div class="grp">'+g.group+'</div>';
    items.forEach(function(i){ html += '<a href="#'+i.slug+'" data-slug="'+i.slug+'">'+i.title+'</a>'; });
  });
  list.innerHTML = html;
  markActive();
}
function buildSide(){
  // Build the search input ONCE (rebuilding it on every keystroke used to drop characters), then only
  // refresh the nav list as the user types.
  var s = document.getElementById('side');
  s.innerHTML = '<input class="search" id="q" placeholder="Search docs..." autocomplete="off"><div id="navlist"></div>';
  document.getElementById('q').addEventListener('input', function(){ buildNav(this.value); });
  buildNav('');
}
function markActive(){
  var slug = (location.hash||'#'+DOC.first).slice(1);
  [].forEach.call(document.querySelectorAll('.side a'), function(a){ a.classList.toggle('on', a.getAttribute('data-slug')===slug); });
}
function render(){
  var slug = (location.hash||'#'+DOC.first).slice(1);
  var pg = DOC.pages[slug] || DOC.pages[DOC.first];
  var c = document.getElementById('content');
  if(typeof marked!=='undefined' && marked.parse){ c.innerHTML = marked.parse(pg.md); } else { c.textContent = pg.md; }
  // rewrite internal .md links to hash routes
  [].forEach.call(c.querySelectorAll('a[href$=".md"]'), function(a){ a.setAttribute('href', '#'+a.getAttribute('href').replace('.md','')); });
  document.title = pg.title + ' - BullQuest Docs';
  // pager
  var idx = flat.findIndex(function(i){ return i.slug===slug; });
  var pv = idx>0?flat[idx-1]:null, nx = idx>=0&&idx<flat.length-1?flat[idx+1]:null, ph='';
  if(pv) ph += '<a href="#'+pv.slug+'"><small>Previous</small>'+pv.title+'</a>'; else ph+='<span style="flex:1"></span>';
  if(nx) ph += '<a class="next" href="#'+nx.slug+'"><small>Next</small>'+nx.title+'</a>'; else ph+='<span style="flex:1"></span>';
  document.getElementById('pager').innerHTML = ph;
  markActive();
  document.body.classList.remove('nav-open');
  window.scrollTo(0,0);
}
document.getElementById('menuBtn').addEventListener('click', function(){ document.body.classList.toggle('nav-open'); });
document.getElementById('themeBtn').addEventListener('click', function(){
  var d = document.documentElement, cur = d.getAttribute('data-theme');
  var next = cur==='dark'?'light':(cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));
  d.setAttribute('data-theme', next); try{ localStorage.setItem('bqdocs-theme', next); }catch(e){}
});
try{ var qt=(location.search.match(/[?&]theme=(light|dark)/)||[])[1]; var t=qt||localStorage.getItem('bqdocs-theme'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
window.addEventListener('hashchange', render);
buildSide('');
render();
</script>

<script>
(function(){
  var EP='https://cewumdioknvjtsiolxce.supabase.co/functions/v1/assistant';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNld3VtZGlva252anRzaW9seGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2OTI3NzUsImV4cCI6MjA5OTI2ODc3NX0.n_r2gixZZTuTyJOiUhCZMpPKp5mUYtdM9bShs-nWkWk';
  var convo=[], busy=false, greeted=false, typingEl=null;
  var panel=document.getElementById('dqAiPanel'), body=document.getElementById('dqAiBody'), input=document.getElementById('dqAiIn'), sendBtn=document.getElementById('dqAiSend'), btn=document.getElementById('dqAiBtn');
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function md(s){ s=esc(String(s||'')); s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(_,t,h){h=h.trim();var ok=/^docs\.html#[a-z0-9-]+$/i.test(h)||/^https:\/\/[^\s"']+$/i.test(h);return ok?('<a href="'+h+'">'+t+'</a>'):t;}); s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); return s.replace(/\n/g,'<br>'); }
  function addMsg(role,text){ var d=document.createElement('div'); d.className='dqai-msg '+(role==='me'?'me':'bot'); d.innerHTML=(role==='me')?esc(text):md(text); body.appendChild(d); body.scrollTop=body.scrollHeight; }

  function greet(){ if(greeted)return; greeted=true; addMsg('bot',"Hey! I'm the Bull Assistant. Ask me anything about BullQuest: duels, your free bull, GRIT, the roadmap, whatever you need."); var c=document.createElement('div'); c.className='dqai-chips'; ['How do duels work?','Is it free?','Do I need a wallet?','How does rarity work?'].forEach(function(q){ var b=document.createElement('button'); b.className='dqai-chip'; b.type='button'; b.textContent=q; b.addEventListener('click',function(){ input.value=q; send(); }); c.appendChild(b); }); body.appendChild(c); }
  function send(){ var q=(input.value||'').trim(); if(!q||busy)return; input.value=''; addMsg('me',q); convo.push({role:'user',content:q}); busy=true; sendBtn.disabled=true; typing(true);
    fetch(EP,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({messages:convo.slice(-10)})})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })

      .catch(function(){ typing(false); addMsg('bot',"I can't reach the assistant right now, please try again in a moment."); })
      .then(function(){ busy=false; sendBtn.disabled=false; input.focus(); });
  }

})();
